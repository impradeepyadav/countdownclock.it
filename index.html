<html lang="en">
<head>

      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }

    <!-- ============ ALL STYLES (INLINE) ============ -->
    <style>
        :root {
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --green-primary: #4caf50;
            --green-hover: #43a047;
            --blue-primary: #3b82f6;
            --gray-light: #f3f4f6;
            --gray-hover: #e5e7eb;
            --border-color: #e5e7eb;
            --danger: #ef4444;
            --shadow-color: rgba(0,0,0,0.1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body { user-select: none; -webkit-user-select: none; }
        input, textarea, h1, p, a, .header-text {
            user-select: text;
            -webkit-user-select: text;
        }

        html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {
            background-color: var(--card-bg);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(14px, 3vh, 32px) clamp(12px, 4vw, 40px) clamp(12px, 2.5vh, 24px);
            gap: clamp(10px, 2vh, 20px);
        }

        .site-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: clamp(10px, 2vw, 22px);
            flex-shrink: 0;
            min-width: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2vw, 16px);
            flex: 1 1 auto;
            min-width: 0;
        }

        .header-logo {
            width: clamp(32px, 6vw, 48px);
            height: clamp(32px, 6vw, 48px);
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 8px;
        }

        .header-text { min-width: 0; }

        .site-header h1 {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: clamp(22px, min(4vh, 6.4vw), 38px);
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: var(--text-main);
            margin-bottom: 0.4vh;
            overflow-wrap: break-word;
        }

        .site-header p {
            font-size: clamp(13px, min(1.9vh, 3.6vw), 17px);
            color: var(--text-muted);
            line-height: 1.45;
            max-width: 62ch;
            overflow-wrap: break-word;
        }

        .top-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
            flex: 0 0 auto;
            min-width: 0;
            padding-top: clamp(4px, 0.8vh, 8px);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            flex-grow: 1;
            flex-shrink: 0;
            gap: clamp(10px, 2vh, 20px);
            min-width: 0;
        }

        .presets {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(6px, 1.2vw, 14px);
            width: 100%;
            min-width: 0;
        }

        .preset-btn {
            background-color: var(--gray-light);
            color: var(--text-muted);
            border: none;
            padding: 0.7vh clamp(12px, 2.2vw, 20px);
            border-radius: 20px;
            font-size: clamp(13px, min(2vh, 3.6vw), 17px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .preset-btn:hover { background-color: var(--gray-hover); color: var(--text-main); }
        .preset-btn.active, .preset-btn.active:hover { background-color: var(--green-primary); color: #fff; }

        .timer-display {
            position: relative;
            width: clamp(180px, min(36vh, 74vw), 350px);
            height: clamp(180px, min(36vh, 74vw), 350px);
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 1vh 0;
            flex-shrink: 0;
        }

        .ring-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg { fill: none; stroke: var(--gray-light); stroke-width: 12; }

        .ring-progress {
            fill: none;
            stroke: var(--green-primary);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 816.81;
            stroke-dashoffset: 0;
            transition: stroke 0.3s;
        }

        .time-text {
            font-size: clamp(2rem, min(6.5vh, 10.5vw), 3.9rem);
            font-weight: 900;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            z-index: 10;
            line-height: 1;
            margin-bottom: 0.4vh;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .status-text {
            font-size: clamp(12px, min(1.8vh, 3.4vw), 17px);
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            z-index: 10;
            text-transform: uppercase;
            text-align: center;
        }

        .main-content:fullscreen,
        .main-content:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            padding: clamp(14px, 2.5vh, 32px) clamp(12px, 3vw, 40px);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 1.8vh, 22px);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .main-content:fullscreen .presets,
        .main-content:-webkit-full-screen .presets {
            display: none !important;
        }

        .main-content:fullscreen .timer-display,
        .main-content:-webkit-full-screen .timer-display {
            width: clamp(200px, min(50vh, 58vw), 480px);
            height: clamp(200px, min(50vh, 58vw), 480px);
            margin: 0.5vh 0;
        }

        .main-content:fullscreen .time-text,
        .main-content:-webkit-full-screen .time-text {
            font-size: clamp(2.2rem, min(10vh, 12vw), 5.4rem);
        }

        .main-content:fullscreen .status-text,
        .main-content:-webkit-full-screen .status-text {
            font-size: clamp(13px, min(2.6vh, 3.8vw), 22px);
            letter-spacing: 0.4vh;
        }

        .fs-exit-btn {
            display: none;
            position: fixed;
            top: 18px;
            right: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            color: var(--text-main);
            border: none;
            cursor: pointer;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
            touch-action: manipulation;
            opacity: 0.7;
        }

        .fs-exit-btn:hover, .fs-exit-btn:focus-visible {
            opacity: 1;
            transform: scale(1.08);
            outline: none;
        }

        .fs-exit-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            pointer-events: none;
        }

        .main-content:fullscreen .fs-exit-btn,
        .main-content:-webkit-full-screen .fs-exit-btn {
            display: flex;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: clamp(6px, 1.6vw, 25px);
            flex-wrap: wrap;
            max-width: 100%;
            min-width: 0;
        }

        .input-wrapper { display: flex; flex-direction: column; align-items: center; min-width: 0; }

        .input-wrapper label {
            font-size: clamp(11px, min(1.7vh, 3.2vw), 15px);
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 0.8vh;
        }

        .input-wrapper input {
            width: clamp(64px, 20vw, 110px);
            height: clamp(48px, min(8vh, 13vw), 78px);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: clamp(1.3rem, min(3.6vh, 6.8vw), 2.2rem);
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            outline: none;
            background-color: var(--card-bg);
            transition: all 0.2s;
            min-width: 0;
        }

        .input-wrapper input:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15);
        }

        .input-wrapper input:disabled {
            background-color: var(--gray-light);
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        .input-wrapper input::-webkit-outer-spin-button,
        .input-wrapper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-wrapper input[type=number] { -moz-appearance: textfield; }

        .colon {
            font-size: clamp(1.3rem, min(3.6vh, 6.8vw), 2.2rem);
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 2vh;
        }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            flex-shrink: 0;
            width: 100%;
            min-width: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2vw, 20px);
            flex-wrap: wrap;
            max-width: 100%;
            min-width: 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: clamp(10px, 1.8vh, 16px) clamp(14px, 4.5vw, 38px);
            border-radius: 30px;
            font-size: clamp(15px, min(2.4vh, 4.2vw), 20px);
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .btn-start {
            background-color: var(--green-primary);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .btn-start:hover { background-color: var(--green-hover); transform: translateY(-2px); }

        .btn-start.paused {
            background-color: #ff9800;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }

        .btn-start.paused:hover { background-color: #f57c00; }

        .btn-reset { background-color: var(--gray-light); color: var(--text-main); }
        .btn-reset:hover { background-color: var(--gray-hover); transform: translateY(-2px); }

        .btn-icon {
            width: clamp(44px, min(6.8vh, 10vw), 58px);
            height: clamp(44px, min(6.8vh, 10vw), 58px);
            border-radius: 50%;
            background-color: var(--gray-light);
            color: var(--text-muted);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .btn-icon:hover { background-color: var(--gray-hover); color: var(--text-main); }
        .btn-icon.muted { color: var(--danger); background-color: rgba(239, 68, 68, 0.1); }

        .hint {
            font-size: clamp(12px, min(1.9vh, 3.4vw), 17px);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            text-align: center;
            max-width: 100%;
            padding: 0 4px;
        }

        .hint kbd {
            background-color: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: inherit;
            font-size: clamp(11px, min(1.7vh, 3vw), 15px);
            font-weight: 700;
            color: var(--text-main);
        }

        svg.icon {
            width: clamp(18px, min(2.5vh, 4.2vw), 24px);
            height: clamp(18px, min(2.5vh, 4.2vw), 24px);
            fill: currentColor;
            flex-shrink: 0;
        }

        svg.hint-icon {
            width: clamp(14px, min(2.1vh, 3.4vw), 18px);
            height: clamp(14px, min(2.1vh, 3.4vw), 18px);
            flex-shrink: 0;
        }

        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        button:focus-visible, a:focus-visible {
            outline: 2px solid var(--blue-primary);
            outline-offset: 2px;
        }

        .privacy-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(12px, min(1.7vh, 3vw), 14px);
            font-weight: 300;
            transition: color 0.2s;
            display: inline-block;
            padding: 4px 2px;
            white-space: nowrap;
            line-height: 1.2;
        }

        .privacy-link:hover { color: var(--text-main); }

        .lang-dropdown, .tools-dropdown { position: relative; }

        .lang-btn, .tools-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: clamp(12px, min(1.7vh, 3vw), 14px);
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
            padding: 4px 2px;
            font-family: inherit;
            line-height: 1.2;
        }

        .lang-btn:hover, .tools-btn:hover { color: var(--text-main); }

        .caret { font-size: 8px; margin-top: 2px; }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background-color: var(--card-bg);
            min-width: 140px;
            max-width: calc(100vw - 24px);
            box-shadow: 0 4px 15px var(--shadow-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            font-weight: 300;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .dropdown-content a:hover { background-color: var(--gray-light); }
        .dropdown-content.show { display: block; }

        .dropdown-content.tools-content {
            min-width: 200px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            animation: modal-fade-in 0.15s ease;
        }
        @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
        .modal p {
            font-size: clamp(14px, min(2vh, 3.4vw), 16px);
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .modal-buttons .btn { padding: 10px 22px; font-size: 15px; }

        @media (max-width: 768px) {
            .site-header { flex-direction: column; align-items: center; text-align: center; gap: 12px; }
            .brand { flex-direction: column; align-items: center; text-align: center; max-width: 100%; }
            .top-controls { justify-content: center; padding-top: 0; }
            .dropdown-content { right: auto; left: 50%; transform: translateX(-50%); }
        }

        @media (max-width: 480px) {
            .container { padding: 14px 12px 12px; }
            .controls-wrapper { gap: 1.2vh; }
            .preset-btn { padding: 7px 12px; }
            .btn { gap: 7px; }
            .colon { margin-bottom: 1.6vh; }
            .fs-exit-btn { width: 38px; height: 38px; top: 12px; right: 12px; }
            .fs-exit-btn svg { width: 24px; height: 24px; }
        }

        @media (max-width: 380px) {
            .preset-btn { padding: 6px 10px; font-size: 12px; }
            .btn { padding: 10px 15px; font-size: 14px; }
            .btn-icon { width: 44px; height: 44px; }
            .controls { gap: 8px; }
            .input-group { gap: 6px; }
            .top-controls { gap: 4px; }
        }

        @media (max-width: 330px) {
            .preset-btn { padding: 6px 8px; }
            .btn { padding: 10px 12px; }
        }

        @media (max-height: 520px) {
            .site-header p { display: none; }
            .container { gap: 8px; padding-top: 10px; }
            .main-content:not(:fullscreen):not(:-webkit-full-screen) .timer-display {
                width: clamp(150px, min(48vh, 56vw), 240px);
                height: clamp(150px, min(48vh, 56vw), 240px);
                margin: 0.5vh 0;
            }
            .main-content { gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <header class="site-header">
            <div class="brand">
                <img src="/apple-touch-icon.png" alt="TimerClock logo" class="header-logo" width="48" height="48" loading="eager">
                <div class="header-text">
                    <h1>Set a Free Online Countdown Timer</h1>
                    <p>Online Countdown Timer for Work, Study, Exercise and Daily Tasks</p>
                </div>
            </div>

            <div class="top-controls">
                <div class="tools-dropdown">
                    <button type="button" class="tools-btn" id="toolsBtn" onclick="toggleToolsDropdown()" aria-label="Tools" aria-expanded="false" aria-controls="toolsDropdown">
                        <span>Tools</span> <span class="caret" aria-hidden="true">▼</span>
                    </button>
                    <!-- Populated automatically by tools.js -->
                    <div class="dropdown-content tools-content" id="toolsDropdown"></div>
                </div>

                <div class="lang-dropdown">
                    <button type="button" class="lang-btn" id="langBtn" onclick="toggleLangDropdown()" aria-label="Select language" aria-expanded="false" aria-controls="langDropdown">
                        <span>English (US)</span> <span class="caret" aria-hidden="true">▼</span>
                    </button>
                    <div class="dropdown-content" id="langDropdown">
                        <a href="/" hreflang="en">English (US)</a>
                        <a href="/hi/" hreflang="hi">हिंदी</a>
                        <a href="/es/" hreflang="es">Español</a>
                        <a href="/fr/" hreflang="fr">Français</a>
                        <a href="/de/" hreflang="de">Deutsch</a>
                    </div>
                </div>

                <a href="/privacy" class="privacy-link">Privacy</a>
            </div>
        </header>

        <div class="main-content" id="mainContent">
            <div class="presets" id="presetsSection" role="group" aria-label="Timer presets">
                <button type="button" class="preset-btn" data-minutes="1"  aria-pressed="false" onclick="setPreset(1)">1 min</button>
                <button type="button" class="preset-btn" data-minutes="5"  aria-pressed="false" onclick="setPreset(5)">5 min</button>
                <button type="button" class="preset-btn" data-minutes="10" aria-pressed="false" onclick="setPreset(10)">10 min</button>
                <button type="button" class="preset-btn" data-minutes="15" aria-pressed="false" onclick="setPreset(15)">15 min</button>
                <button type="button" class="preset-btn" data-minutes="25" aria-pressed="false" onclick="setPreset(25)">25 min</button>
                <button type="button" class="preset-btn" data-minutes="30" aria-pressed="false" onclick="setPreset(30)">30 min</button>
                <button type="button" class="preset-btn" data-minutes="45" aria-pressed="false" onclick="setPreset(45)">45 min</button>
                <button type="button" class="preset-btn" data-minutes="60" aria-pressed="false" onclick="setPreset(60)">1 hr</button>
            </div>

            <div class="timer-display" id="timerDisplay">
                <svg class="ring-svg" viewBox="0 0 280 280" aria-hidden="true">
                    <circle class="ring-bg" cx="140" cy="140" r="130"></circle>
                    <circle class="ring-progress" id="progressRing" cx="140" cy="140" r="130"></circle>
                </svg>
                <div class="time-text" id="timeDisplay" role="timer" aria-live="off">
                    <span id="mainTime">00:01:00</span>
                </div>
                <div class="status-text" id="statusText" aria-live="polite">READY</div>

                <button type="button" class="fs-exit-btn" id="fsExitBtn" onclick="exitFullscreen()" aria-label="Exit fullscreen" title="Exit fullscreen">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>

            <div class="input-group" id="inputsSection">
                <div class="input-wrapper">
                    <label for="inputHours">HOURS</label>
                    <input type="number" id="inputHours" value="0" min="0" max="99" inputmode="numeric">
                </div>
                <div class="colon" aria-hidden="true">:</div>
                <div class="input-wrapper">
                    <label for="inputMinutes">MINUTES</label>
                    <input type="number" id="inputMinutes" value="1" min="0" max="59" inputmode="numeric">
                </div>
                <div class="colon" aria-hidden="true">:</div>
                <div class="input-wrapper">
                    <label for="inputSeconds">SECONDS</label>
                    <input type="number" id="inputSeconds" value="0" min="0" max="59" inputmode="numeric">
                </div>
            </div>

            <div class="controls-wrapper">
                <div class="controls">
                    <button type="button" class="btn btn-start" id="startBtn" onclick="toggleTimer()" aria-label="Start timer">
                        <svg class="icon" id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="icon" id="pauseIcon" style="display:none;" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        <span id="startBtnText">Start</span>
                    </button>

                    <button type="button" class="btn btn-reset" id="resetBtn" onclick="handleReset()" aria-label="Reset timer">
                        <svg class="icon" id="resetIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        <span id="resetText">Reset</span>
                    </button>

                    <button type="button" class="btn-icon" id="muteBtn" onclick="toggleMute()" title="Mute / unmute sound" aria-label="Mute">
                        <svg class="icon" id="soundOnIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg class="icon" id="soundOffIcon" style="display:none;" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>

                    <button type="button" class="btn-icon" id="fsBtn" onclick="enterFullscreen()" title="Fullscreen clock" aria-label="Enter fullscreen clock">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>

                <div class="hint">
                    <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Press <kbd>Space</kbd> to start / pause
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true">
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button type="button" class="btn btn-reset" id="modalCancel">Cancel</button>
                <button type="button" class="btn btn-start" id="modalOk">OK</button>
            </div>
        </div>
    </div>

    <!-- ============ TOOLS (EXTERNAL FILE) ============ -->
    <!-- ⭐ Naya URL add karne ke liye sirf tools.js edit karo -->
    <script src="tools.js"></script>

    <!-- ============ MAIN TIMER LOGIC (INLINE) ============ -->
    <script>
        const mainTime       = document.getElementById('mainTime');
        const timeDisplayEl  = document.getElementById('timeDisplay');
        const statusText     = document.getElementById('statusText');
        const startBtnText   = document.getElementById('startBtnText');
        const startBtn       = document.getElementById('startBtn');
        const playIcon       = document.getElementById('playIcon');
        const pauseIcon      = document.getElementById('pauseIcon');
        const resetBtn       = document.getElementById('resetBtn');
        const resetText      = document.getElementById('resetText');
        const resetIcon      = document.getElementById('resetIcon');

        const progressRing   = document.getElementById('progressRing');
        const inputHours     = document.getElementById('inputHours');
        const inputMinutes   = document.getElementById('inputMinutes');
        const inputSeconds   = document.getElementById('inputSeconds');

        const muteBtn        = document.getElementById('muteBtn');
        const soundOnIcon    = document.getElementById('soundOnIcon');
        const soundOffIcon   = document.getElementById('soundOffIcon');

        const toolsBtn       = document.getElementById('toolsBtn');
        const toolsDropdown  = document.getElementById('toolsDropdown');

        const langBtn        = document.getElementById('langBtn');
        const langDropdown   = document.getElementById('langDropdown');

        const mainContent    = document.getElementById('mainContent');
        const fsBtn          = document.getElementById('fsBtn');

        const modalOverlay   = document.getElementById('modalOverlay');
        const modalMessage   = document.getElementById('modalMessage');
        const modalOk        = document.getElementById('modalOk');
        const modalCancel    = document.getElementById('modalCancel');

        let rafId = null;
        let backstopId = null;
        let zeroMsgTimeout = null;
        let isRunning = false;

        let targetTime = 0;
        let totalSeconds = 0;
        let initialTotalSeconds = 0;
        let remainingMs = 0;

        let isMuted = false;
        const circumference = 2 * Math.PI * 130;
        let audioCtx;

        const MAX_SECONDS = 99 * 3600 + 59 * 60 + 59;

        progressRing.style.strokeDasharray = circumference;

        let modalResolve = null;

        function showConfirm(message) {
            if (modalResolve) return Promise.resolve(false);
            return new Promise((resolve) => {
                modalMessage.textContent = message;
                modalOverlay.classList.remove('hidden');
                modalResolve = resolve;
                setTimeout(() => modalOk.focus(), 0);
            });
        }

        function closeModal(result) {
            modalOverlay.classList.add('hidden');
            const r = modalResolve;
            modalResolve = null;
            if (r) r(result);
        }

        modalOk.addEventListener('click', () => closeModal(true));
        modalCancel.addEventListener('click', () => closeModal(false));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal(false);
        });

        function getFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
        }

        function enterFullscreen() {
            const el = mainContent;
            const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (!req) {
                if (fsBtn) fsBtn.style.display = 'none';
                return;
            }
            try {
                const p = req.call(el);
                if (p && p.catch) p.catch(() => {});
            } catch (err) { }
        }

        function exitFullscreen() {
            const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (!exit) return;
            try {
                const p = exit.call(document);
                if (p && p.catch) p.catch(() => {});
            } catch (err) { }
        }

        function handleFullscreenChange() {
            const isFs = !!getFullscreenElement();
            fsBtn.style.display = isFs ? 'none' : '';
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        function toggleToolsDropdown() {
            const isOpen = toolsDropdown.classList.toggle('show');
            toolsBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            if (isOpen) {
                langDropdown.classList.remove('show');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        }

        function toggleLangDropdown() {
            const isOpen = langDropdown.classList.toggle('show');
            langBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            if (isOpen) {
                toolsDropdown.classList.remove('show');
                toolsBtn.setAttribute('aria-expanded', 'false');
            }
        }

        document.addEventListener('click', (e) => {
            if (!toolsBtn.contains(e.target) && !toolsDropdown.contains(e.target)) {
                toolsDropdown.classList.remove('show');
                toolsBtn.setAttribute('aria-expanded', 'false');
            }
            if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
                langDropdown.classList.remove('show');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('click', (e) => {
            if (e.detail > 0 && e.target instanceof Element) {
                const btn = e.target.closest('button');
                if (btn) btn.blur();
            }
        });

        function setStartButton(state) {
            const text = state === 'running' ? 'Pause' : (state === 'paused' ? 'Resume' : 'Start');
            startBtnText.textContent = text;
            startBtn.setAttribute('aria-label', `${text} timer`);
            startBtn.classList.toggle('paused', state === 'paused');
            playIcon.style.display  = state === 'running' ? 'none' : 'block';
            pauseIcon.style.display = state === 'running' ? 'block' : 'none';
        }

        function clearPresetActive() {
            document.querySelectorAll('.preset-btn').forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-pressed', 'false');
            });
        }

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (err) { return; }
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }

        function playBeep() {
            if (isMuted || !audioCtx) return;
            const schedule = () => {
                try {
                    const beep = (delay) => {
                        const osc  = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const t0 = audioCtx.currentTime + delay;
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, t0);
                        gain.gain.setValueAtTime(0.1, t0);
                        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.5);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(t0);
                        osc.stop(t0 + 1.5);
                    };
                    beep(0);
                    beep(0.3);
                } catch (err) { }
            };
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(schedule).catch(() => {});
            } else {
                schedule();
            }
        }

        function updateCountdownText() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            mainTime.textContent =
                `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateDisplay() {
            updateCountdownText();
            const initMs = initialTotalSeconds * 1000;
            if (initMs > 0) {
                progressRing.style.strokeDashoffset =
                    circumference - ((totalSeconds * 1000) / initMs) * circumference;
            } else {
                progressRing.style.strokeDashoffset = circumference;
            }
        }

        function setupInput(input, max) {
            input.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (e.key === 'e' || e.key === 'E' || e.key === '+' || e.key === '-' || e.key === '.') {
                    e.preventDefault();
                }
            });

            input.addEventListener('input', () => {
                if (input.value !== '') {
                    const val = parseInt(input.value, 10);
                    if (!isNaN(val)) {
                        if (val > max) input.value = String(max);
                        if (val < 0)  input.value = '0';
                    }
                }
                if (!isRunning) {
                    clearPresetActive();
                    updateTimeFromInputs();
                }
            });

            input.addEventListener('blur', () => {
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 0) val = 0;
                if (val > max) val = max;
                const normalized = String(val);
                if (input.value !== normalized) {
                    input.value = normalized;
                    if (!isRunning) {
                        clearPresetActive();
                        updateTimeFromInputs();
                    }
                }
            });
        }

        setupInput(inputHours, 99);
        setupInput(inputMinutes, 59);
        setupInput(inputSeconds, 59);

        function updateTimeFromInputs() {
            const h = parseInt(inputHours.value, 10) || 0;
            const m = parseInt(inputMinutes.value, 10) || 0;
            const s = parseInt(inputSeconds.value, 10) || 0;

            totalSeconds = (h * 3600) + (m * 60) + s;
            initialTotalSeconds = totalSeconds;
            remainingMs = 0;

            if (!isRunning) {
                progressRing.style.stroke = 'var(--green-primary)';
                statusText.textContent = 'READY';
                statusText.style.color = 'var(--text-muted)';
                setStartButton('ready');
            }
            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            initAudio();

            if (remainingMs <= 0 && totalSeconds <= 0) updateTimeFromInputs();
            const msToRun = remainingMs > 0 ? remainingMs : (totalSeconds * 1000);
            if (msToRun <= 0) {
                statusText.textContent = 'SET TIME';
                statusText.style.color = 'var(--danger)';
                clearTimeout(zeroMsgTimeout);
                zeroMsgTimeout = setTimeout(() => {
                    if (!isRunning && remainingMs <= 0 && totalSeconds <= 0) {
                        statusText.textContent = 'READY';
                        statusText.style.color = 'var(--text-muted)';
                    }
                }, 1500);
                return;
            }

            if (remainingMs <= 0) initialTotalSeconds = totalSeconds;

            progressRing.style.stroke = 'var(--green-primary)';
            targetTime = Date.now() + msToRun;
            remainingMs = msToRun;

            inputHours.disabled = true;
            inputMinutes.disabled = true;
            inputSeconds.disabled = true;

            clearTimeout(backstopId);
            backstopId = setTimeout(finishCountdown, msToRun);

            isRunning = true;
            statusText.textContent = 'RUNNING';
            statusText.style.color = 'var(--green-primary)';
            setStartButton('running');

            cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(countdownLoop);
        }

        function countdownLoop() {
            if (!isRunning) return;
            const remaining = Math.max(0, targetTime - Date.now());
            remainingMs = remaining;

            const secs = Math.ceil(remaining / 1000);
            if (secs !== totalSeconds) {
                totalSeconds = secs;
                updateCountdownText();
            }

            const initMs = initialTotalSeconds * 1000;
            if (initMs > 0) {
                progressRing.style.strokeDashoffset =
                    circumference - (remaining / initMs) * circumference;
            }

            if (remaining <= 0) {
                finishCountdown();
                return;
            }
            rafId = requestAnimationFrame(countdownLoop);
        }

        function finishCountdown() {
            if (!isRunning) return;
            cancelAnimationFrame(rafId);
            rafId = null;
            clearTimeout(backstopId);
            backstopId = null;
            isRunning = false;
            remainingMs = 0;
            totalSeconds = 0;
            updateCountdownText();

            statusText.textContent = "TIME'S UP!";
            statusText.style.color = 'var(--danger)';
            progressRing.style.stroke = 'var(--danger)';
            progressRing.style.strokeDashoffset = String(circumference);
            setStartButton('ready');

            playBeep();

            inputHours.disabled = false;
            inputMinutes.disabled = false;
            inputSeconds.disabled = false;
        }

        function pauseTimer() {
            cancelAnimationFrame(rafId);
            rafId = null;
            clearTimeout(backstopId);
            backstopId = null;

            remainingMs = Math.max(0, targetTime - Date.now());
            if (remainingMs <= 0) {
                finishCountdown();
                return;
            }
            isRunning = false;
            totalSeconds = Math.ceil(remainingMs / 1000);
            updateCountdownText();
            const initMs = initialTotalSeconds * 1000;
            if (initMs > 0) {
                progressRing.style.strokeDashoffset =
                    circumference - (remainingMs / initMs) * circumference;
            }
            inputHours.disabled = false;
            inputMinutes.disabled = false;
            inputSeconds.disabled = false;

            statusText.textContent = 'PAUSED';
            statusText.style.color = 'var(--text-muted)';
            setStartButton('paused');
        }

        function resetTimer() {
            cancelAnimationFrame(rafId);
            rafId = null;
            clearTimeout(backstopId);
            backstopId = null;
            clearTimeout(zeroMsgTimeout);
            zeroMsgTimeout = null;
            isRunning = false;
            remainingMs = 0;

            inputHours.disabled = false;
            inputMinutes.disabled = false;
            inputSeconds.disabled = false;

            updateTimeFromInputs();
            progressRing.style.stroke = 'var(--green-primary)';
            statusText.textContent = 'READY';
            statusText.style.color = 'var(--text-muted)';
            setStartButton('ready');
        }

        function handleReset() {
            resetTimer();
        }

        async function setPreset(minutes) {
            const hasProgress = isRunning || remainingMs > 0;
            if (hasProgress) {
                const ok = await showConfirm('Timer is running or paused. Reset and apply this preset?');
                if (!ok) return;
            }

            cancelAnimationFrame(rafId);
            rafId = null;
            clearTimeout(backstopId);
            backstopId = null;
            clearTimeout(zeroMsgTimeout);
            zeroMsgTimeout = null;
            isRunning = false;
            remainingMs = 0;

            inputHours.value   = Math.min(99, Math.floor(minutes / 60));
            inputMinutes.value = Math.min(59, minutes % 60);
            inputSeconds.value = 0;

            updateTimeFromInputs();
            statusText.textContent = 'READY';
            statusText.style.color = 'var(--text-muted)';
            progressRing.style.stroke = 'var(--green-primary)';
            inputHours.disabled = false;
            inputMinutes.disabled = false;
            inputSeconds.disabled = false;
            setStartButton('ready');

            document.querySelectorAll('.preset-btn').forEach(b => {
                const active = b.dataset.minutes === String(minutes);
                b.classList.toggle('active', active);
                b.setAttribute('aria-pressed', active ? 'true' : 'false');
            });
        }

        function toggleMute() {
            isMuted = !isMuted;
            muteBtn.setAttribute('aria-label', isMuted ? 'Unmute' : 'Mute');
            if (isMuted) {
                muteBtn.classList.add('muted');
                soundOnIcon.style.display = 'none';
                soundOffIcon.style.display = 'block';
            } else {
                muteBtn.classList.remove('muted');
                soundOnIcon.style.display = 'block';
                soundOffIcon.style.display = 'none';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (modalResolve) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    closeModal(false);
                }
                return;
            }

            if (e.repeat) return;
            const el = e.target instanceof Element ? e.target : document.body;
            if (el.closest('button, a, input, textarea, select, [contenteditable="true"]')) return;

            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                toggleTimer();
            }
        });

        updateTimeFromInputs();
    </script>
</body>
