    <!-- ============ ALL STYLES (INLINE) ============ -->
    <style>
        :root {
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --green-primary: #4caf50;
            --green-hover: #43a047;
            --blue-primary: #3b82f6;
            --gray-light: #f3f4f6;
            --gray-hover: #e5e7eb;
            --border-color: #e5e7eb;
            --danger: #ef4444;
            --shadow-color: rgba(0,0,0,0.1);

            --egg-soft: #fbbf24;
            --egg-soft-hover: #f59e0b;
            --egg-soft-soft: rgba(251, 191, 36, 0.15);
            --egg-medium: #f97316;
            --egg-medium-hover: #ea580c;
            --egg-medium-soft: rgba(249, 115, 22, 0.15);
            --egg-hard: #dc2626;
            --egg-hard-hover: #b91c1c;
            --egg-hard-soft: rgba(220, 38, 38, 0.15);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body { user-select: none; -webkit-user-select: none; }
        input, textarea, h1, p, a, .header-text {
            user-select: text;
            -webkit-user-select: text;
        }

        html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {
            background-color: var(--card-bg);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: clamp(14px, 3vh, 32px) clamp(12px, 4vw, 40px) clamp(12px, 2.5vh, 24px);
            gap: clamp(10px, 2vh, 20px);
        }

        /* ================= SITE HEADER ================= */
        .site-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: clamp(10px, 2vw, 22px);
            flex-shrink: 0;
            min-width: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: clamp(10px, 2vw, 16px);
            flex: 1 1 auto;
            min-width: 0;
        }

        .header-logo {
            width: clamp(32px, 6vw, 48px);
            height: clamp(32px, 6vw, 48px);
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 8px;
        }

        .header-text { min-width: 0; }

        .site-header h1 {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: clamp(22px, min(4vh, 6.4vw), 38px);
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: var(--text-main);
            margin-bottom: 0.4vh;
            overflow-wrap: break-word;
        }

        .site-header p {
            font-size: clamp(13px, min(1.9vh, 3.6vw), 17px);
            color: var(--text-muted);
            line-height: 1.45;
            max-width: 62ch;
            overflow-wrap: break-word;
        }

        .top-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 6px;
            flex: 0 0 auto;
            min-width: 0;
            padding-top: clamp(4px, 0.8vh, 8px);
        }

        /* ================= MAIN CONTENT ================= */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            flex-grow: 1;
            flex-shrink: 0;
            gap: clamp(10px, 2vh, 20px);
            min-width: 0;
        }

        /* ================= PRESETS ================= */
        .presets {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(8px, 1.4vw, 14px);
            width: 100%;
            max-width: 560px;
            min-width: 0;
        }

        .preset-btn {
            flex: 1;
            min-width: 0;
            background-color: var(--gray-light);
            color: var(--text-muted);
            border: 2px solid transparent;
            padding: clamp(8px, 1.4vh, 12px) clamp(10px, 2vw, 18px);
            border-radius: 14px;
            font-size: clamp(12px, min(1.9vh, 3.4vw), 15px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            line-height: 1.2;
            font-family: inherit;
        }

        .preset-btn .preset-name {
            font-weight: 700;
            font-size: clamp(13px, min(2.1vh, 3.6vw), 16px);
        }

        .preset-btn .preset-time {
            font-size: clamp(11px, min(1.6vh, 3vw), 13px);
            font-weight: 500;
            opacity: 0.8;
        }

        .preset-btn:hover {
            background-color: var(--gray-hover);
            color: var(--text-main);
        }

        .preset-btn.active[data-type="soft"] {
            background-color: var(--egg-soft-soft);
            border-color: var(--egg-soft);
            color: var(--egg-soft-hover);
        }

        .preset-btn.active[data-type="medium"] {
            background-color: var(--egg-medium-soft);
            border-color: var(--egg-medium);
            color: var(--egg-medium-hover);
        }

        .preset-btn.active[data-type="hard"] {
            background-color: var(--egg-hard-soft);
            border-color: var(--egg-hard);
            color: var(--egg-hard-hover);
        }

        /* ================= TIMER DISPLAY ================= */
        .timer-display {
            position: relative;
            width: clamp(190px, min(38vh, 76vw), 360px);
            height: clamp(190px, min(38vh, 76vw), 360px);
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0.5vh 0;
            flex-shrink: 0;
        }

        .ring-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg { fill: none; stroke: var(--gray-light); stroke-width: 12; }

        .ring-progress {
            fill: none;
            stroke: var(--egg-soft);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 816.81;
            stroke-dashoffset: 0;
            transition: stroke 0.3s, stroke-dashoffset 0.2s linear;
        }

        .egg-icon {
            font-size: clamp(28px, min(5vh, 8vw), 44px);
            margin-bottom: 4px;
            z-index: 10;
            line-height: 1;
        }

        .time-text {
            font-size: clamp(2.2rem, min(7vh, 11vw), 4rem);
            font-weight: 900;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            z-index: 10;
            line-height: 1;
            letter-spacing: -2px;
            white-space: nowrap;
        }

        .status-text {
            font-size: clamp(12px, min(1.8vh, 3.4vw), 17px);
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            z-index: 10;
            text-transform: uppercase;
            text-align: center;
            margin-top: 0.3vh;
        }

        /* ================= INPUT GROUP ================= */
        .input-group {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: clamp(6px, 1.6vw, 20px);
            flex-wrap: wrap;
            max-width: 100%;
            min-width: 0;
        }

        .input-wrapper { display: flex; flex-direction: column; align-items: center; min-width: 0; }

        .input-wrapper label {
            font-size: clamp(11px, min(1.7vh, 3.2vw), 14px);
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 0.8vh;
        }

        .input-wrapper input {
            width: clamp(70px, 22vw, 110px);
            height: clamp(46px, min(7.5vh, 12vw), 68px);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: clamp(1.2rem, min(3.2vh, 6vw), 1.9rem);
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            outline: none;
            background-color: var(--card-bg);
            transition: all 0.2s;
            min-width: 0;
            font-family: inherit;
        }

        .input-wrapper input:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15);
        }

        .input-wrapper input:disabled {
            background-color: var(--gray-light);
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        .input-wrapper input::-webkit-outer-spin-button,
        .input-wrapper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-wrapper input[type=number] { -moz-appearance: textfield; }

        .colon {
            font-size: clamp(1.2rem, min(3.2vh, 6vw), 1.9rem);
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 1.8vh;
        }

        /* ================= CONTROLS ================= */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            flex-shrink: 0;
            width: 100%;
            min-width: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2vw, 20px);
            flex-wrap: wrap;
            max-width: 100%;
            min-width: 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: clamp(10px, 1.8vh, 16px) clamp(16px, 4vw, 34px);
            border-radius: 30px;
            font-size: clamp(15px, min(2.4vh, 4.2vw), 20px);
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            touch-action: manipulation;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn-start {
            background-color: var(--egg-soft);
            color: white;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.35);
        }

        .btn-start:hover {
            background-color: var(--egg-soft-hover);
            transform: translateY(-2px);
        }

        .btn-start.paused {
            background-color: #ff9800;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }

        .btn-start.paused:hover { background-color: #f57c00; }

        .btn-reset {
            background-color: var(--gray-light);
            color: var(--text-main);
        }

        .btn-reset:hover {
            background-color: var(--gray-hover);
            transform: translateY(-2px);
        }

        .btn-icon {
            width: clamp(44px, min(6.8vh, 10vw), 58px);
            height: clamp(44px, min(6.8vh, 10vw), 58px);
            border-radius: 50%;
            background-color: var(--gray-light);
            color: var(--text-muted);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background-color: var(--gray-hover);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .btn-icon.muted {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .hint {
            font-size: clamp(12px, min(1.9vh, 3.4vw), 16px);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            text-align: center;
            max-width: 100%;
            padding: 0 4px;
        }

        .hint kbd {
            background-color: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: inherit;
            font-size: clamp(11px, min(1.7vh, 3vw), 15px);
            font-weight: 700;
            color: var(--text-main);
        }

        svg.icon {
            width: clamp(18px, min(2.5vh, 4.2vw), 24px);
            height: clamp(18px, min(2.5vh, 4.2vw), 24px);
            fill: currentColor;
            flex-shrink: 0;
        }

        svg.hint-icon {
            width: clamp(14px, min(2.1vh, 3.4vw), 18px);
            height: clamp(14px, min(2.1vh, 3.4vw), 18px);
            flex-shrink: 0;
        }

        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 2px solid var(--blue-primary);
            outline-offset: 2px;
        }

        /* ================= FULLSCREEN ================= */
        .main-content:fullscreen,
        .main-content:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            padding: clamp(14px, 2.5vh, 32px) clamp(12px, 3vw, 40px);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 1.8vh, 22px);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .main-content:fullscreen .presets,
        .main-content:-webkit-full-screen .presets,
        .main-content:fullscreen .input-group,
        .main-content:-webkit-full-screen .input-group {
            display: none !important;
        }

        .main-content:fullscreen .timer-display,
        .main-content:-webkit-full-screen .timer-display {
            width: clamp(220px, min(52vh, 60vw), 500px);
            height: clamp(220px, min(52vh, 60vw), 500px);
        }

        .main-content:fullscreen .time-text,
        .main-content:-webkit-full-screen .time-text {
            font-size: clamp(2.8rem, min(11vh, 14vw), 6rem);
        }

        .main-content:fullscreen .egg-icon,
        .main-content:-webkit-full-screen .egg-icon {
            font-size: clamp(36px, min(7vh, 10vw), 64px);
        }

        .main-content:fullscreen .status-text,
        .main-content:-webkit-full-screen .status-text {
            font-size: clamp(13px, min(2.6vh, 3.8vw), 22px);
            letter-spacing: 0.4vh;
        }

        .fs-exit-btn {
            display: none;
            position: fixed;
            top: 18px;
            right: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            color: var(--text-main);
            border: none;
            cursor: pointer;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
            touch-action: manipulation;
            opacity: 0.7;
        }

        .fs-exit-btn:hover, .fs-exit-btn:focus-visible {
            opacity: 1;
            transform: scale(1.08);
            outline: none;
        }

        .fs-exit-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            pointer-events: none;
        }

        .main-content:fullscreen .fs-exit-btn,
        .main-content:-webkit-full-screen .fs-exit-btn {
            display: flex;
        }

        /* ================= HEADER LINKS ================= */
        .privacy-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(12px, min(1.7vh, 3vw), 14px);
            font-weight: 300;
            transition: color 0.2s;
            display: inline-block;
            padding: 4px 2px;
            white-space: nowrap;
            line-height: 1.2;
        }

        .privacy-link:hover { color: var(--text-main); }

        .lang-dropdown, .tools-dropdown { position: relative; }

        .lang-btn, .tools-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: clamp(12px, min(1.7vh, 3vw), 14px);
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
            padding: 4px 2px;
            font-family: inherit;
            line-height: 1.2;
        }

        .lang-btn:hover, .tools-btn:hover { color: var(--text-main); }

        .caret { font-size: 8px; margin-top: 2px; }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background-color: var(--card-bg);
            min-width: 140px;
            max-width: calc(100vw - 24px);
            box-shadow: 0 4px 15px var(--shadow-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            font-weight: 300;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .dropdown-content a:hover { background-color: var(--gray-light); }
        .dropdown-content.show { display: block; }

        .dropdown-content.tools-content {
            min-width: 200px;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* ================= MODAL ================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            animation: modal-fade-in 0.15s ease;
        }
        @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }
        .modal p {
            font-size: clamp(14px, min(2vh, 3.4vw), 16px);
            color: var(--text-main);
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .modal-buttons .btn { padding: 10px 22px; font-size: 15px; }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .site-header { flex-direction: column; align-items: center; text-align: center; gap: 12px; }
            .brand { flex-direction: column; align-items: center; text-align: center; max-width: 100%; }
            .top-controls { justify-content: center; padding-top: 0; }
            .dropdown-content { right: auto; left: 50%; transform: translateX(-50%); }
        }

        @media (max-width: 480px) {
            .container { padding: 14px 12px 12px; }
            .controls-wrapper { gap: 1.2vh; }
            .fs-exit-btn { width: 38px; height: 38px; top: 12px; right: 12px; }
            .fs-exit-btn svg { width: 24px; height: 24px; }
            .colon { margin-bottom: 1.5vh; }
        }

        @media (max-width: 380px) {
            .btn { padding: 10px 15px; font-size: 14px; }
            .btn-icon { width: 44px; height: 44px; }
            .controls { gap: 8px; }
            .top-controls { gap: 4px; }
            .preset-btn { padding: 7px 8px; font-size: 11px; }
        }

        @media (max-height: 520px) {
            .site-header p { display: none; }
            .container { gap: 8px; padding-top: 10px; }
            .main-content { gap: 8px; }
            .main-content:not(:fullscreen):not(:-webkit-full-screen) .timer-display {
                width: clamp(150px, min(48vh, 60vw), 240px);
                height: clamp(150px, min(48vh, 60vw), 240px);
            }
        }
    </style>
</head>
<body>

        <!-- ===== EGG TIMER MAIN CONTENT ===== -->

                    <span class="preset-name">Soft</span>

                <button type="button" class="preset-btn" data-type="medium" data-minutes="7" aria-pressed="false" onclick="setPreset('medium')">
                    <span class="preset-name">Medium</span>

                </button>
                <button type="button" class="preset-btn" data-type="hard" data-minutes="10" aria-pressed="false" onclick="setPreset('hard')">

            <!-- Timer display -->
            <div class="timer-display" id="timerDisplay">
                <svg class="ring-svg" viewBox="0 0 280 280" aria-hidden="true">

                <button type="button" class="fs-exit-btn" id="fsExitBtn" onclick="exitFullscreen()" aria-label="Exit fullscreen" title="Exit fullscreen">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>

            <!-- Custom time input -->
            <div class="input-group" id="inputsSection">
                <div class="input-wrapper">
                    <label for="inputMinutes">MINUTES</label>
                    <input type="number" id="inputMinutes" value="5" min="0" max="99" inputmode="numeric">
                </div>
                <div class="colon" aria-hidden="true">:</div>
                <div class="input-wrapper">
                    <label for="inputSeconds">SECONDS</label>
                    <input type="number" id="inputSeconds" value="0" min="0" max="59" inputmode="numeric">
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-wrapper">
                <div class="controls">
                    <button type="button" class="btn btn-start" id="startBtn" onclick="toggleTimer()" aria-label="Start egg timer">
                        <svg class="icon" id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="icon" id="pauseIcon" style="display:none;" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        <span id="startBtnText">Start</span>
                    </button>

                    <button type="button" class="btn btn-reset" id="resetBtn" onclick="handleReset()" aria-label="Reset egg timer">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        <span>Reset</span>
                    </button>

                    <button type="button" class="btn-icon" id="muteBtn" onclick="toggleMute()" title="Mute / unmute sound" aria-label="Mute">
                        <svg class="icon" id="soundOnIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg class="icon" id="soundOffIcon" style="display:none;" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>

                    <button type="button" class="btn-icon" id="fsBtn" onclick="enterFullscreen()" title="Fullscreen timer" aria-label="Enter fullscreen timer">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>

                <div class="hint">
                    <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <kbd>Space</kbd> start/pause &nbsp;·&nbsp; <kbd>R</kbd> reset &nbsp;·&nbsp; <kbd>F</kbd> fullscreen
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm modal -->
    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true">
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button type="button" class="btn btn-reset" id="modalCancel">Cancel</button>
                <button type="button" class="btn btn-start" id="modalOk">OK</button>
            </div>
        </div>
    </div>

    <!-- ============ TOOLS (EXTERNAL FILE) ============ -->
    <script src="tools.js"></script>

    <!-- ============ EGG TIMER LOGIC (INLINE) ============ -->
    <script>
        // ---------- DOM refs ----------
        const mainTime       = document.getElementById('mainTime');
        const statusText     = document.getElementById('statusText');
        const startBtnText   = document.getElementById('startBtnText');
        const startBtn       = document.getElementById('startBtn');
        const playIcon       = document.getElementById('playIcon');
        const pauseIcon      = document.getElementById('pauseIcon');

        const progressRing   = document.getElementById('progressRing');
        const inputMinutes   = document.getElementById('inputMinutes');
        const inputSeconds   = document.getElementById('inputSeconds');

        const muteBtn        = document.getElementById('muteBtn');
        const soundOnIcon    = document.getElementById('soundOnIcon');
        const soundOffIcon   = document.getElementById('soundOffIcon');

        const toolsBtn       = document.getElementById('toolsBtn');
        const toolsDropdown  = document.getElementById('toolsDropdown');
        const langBtn        = document.getElementById('langBtn');
        const langDropdown   = document.getElementById('langDropdown');

        const mainContent    = document.getElementById('mainContent');
        const fsBtn          = document.getElementById('fsBtn');

        const modalOverlay   = document.getElementById('modalOverlay');
        const modalMessage   = document.getElementById('modalMessage');
        const modalOk        = document.getElementById('modalOk');
        const modalCancel    = document.getElementById('modalCancel');

        // ---------- Presets ----------
        const PRESETS = {
            soft:   { minutes: 5,  color: '#fbbf24', hover: '#f59e0b', soft: 'rgba(251,191,36,0.35)' },
            medium: { minutes: 7,  color: '#f97316', hover: '#ea580c', soft: 'rgba(249,115,22,0.35)' },
            hard:   { minutes: 10, color: '#dc2626', hover: '#b91c1c', soft: 'rgba(220,38,38,0.35)' }
        };

        const STORAGE_KEY = 'timerclock_eggtimer_prefs_v1';
        const circumference = 2 * Math.PI * 130;
        progressRing.style.strokeDasharray = circumference;

        // ---------- State ----------
        let currentType = 'soft';
        let customType = null;         // null = using preset, string = custom value
        
        let rafId = null;
        let backstopId = null;
        let zeroMsgTimeout = null;
        let isRunning = false;

        let targetTime = 0;
        let totalSeconds = 0;
        let initialTotalSeconds = 0;
        let remainingMs = 0;

        let isMuted = false;
        let audioCtx = null;

        const MAX_SECONDS = 99 * 60 + 59;

        // ---------- Persistence ----------
        function loadPrefs() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const p = JSON.parse(raw);
                if (!p) return;
                if (typeof p.minutes === 'number' && p.minutes >= 0 && p.minutes <= 99) {
                    inputMinutes.value = String(p.minutes);
                }
                if (typeof p.seconds === 'number' && p.seconds >= 0 && p.seconds <= 59) {
                    inputSeconds.value = String(p.seconds);
                }
                if (p.type === 'soft' || p.type === 'medium' || p.type === 'hard') {
                    currentType = p.type;
                }
            } catch (e) { /* ignore */ }
        }

        function savePrefs() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    minutes: parseInt(inputMinutes.value, 10) || 0,
                    seconds: parseInt(inputSeconds.value, 10) || 0,
                    type: currentType
                }));
            } catch (e) { /* ignore */ }
        }

        // ---------- Confirm modal ----------
        let modalResolve = null;

        function showConfirm(message) {
            if (modalResolve) return Promise.resolve(false);
            return new Promise((resolve) => {
                modalMessage.textContent = message;
                modalOverlay.classList.remove('hidden');
                modalResolve = resolve;
                setTimeout(() => modalOk.focus(), 0);
            });
        }

        function closeModal(result) {
            modalOverlay.classList.add('hidden');
            const r = modalResolve;
            modalResolve = null;
            if (r) r(result);
        }

        modalOk.addEventListener('click', () => closeModal(true));
        modalCancel.addEventListener('click', () => closeModal(false));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal(false);
        });

        // ---------- Audio ----------
        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                catch (err) { return; }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        }

        function playBeep() {
            if (isMuted || !audioCtx) return;
            const schedule = () => {
                try {
                    const beep = (delay) => {
                        const osc  = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const t0 = audioCtx.currentTime + delay;
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(880, t0);
                        gain.gain.setValueAtTime(0.12, t0);
                        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.4);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(t0);
                        osc.stop(t0 + 1.45);
                    };
                    beep(0);
                    beep(0.25);
                    beep(0.5);
                } catch (err) { /* ignore */ }
            };
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(schedule).catch(() => {});
            } else {
                schedule();
            }
        }

        // ---------- Formatting ----------
        function pad(n) { return String(n).padStart(2, '0'); }

        function updateCountdownText() {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            mainTime.textContent = pad(m) + ':' + pad(s);
        }

        function updateDisplay() {
            updateCountdownText();
            const initMs = initialTotalSeconds * 1000;
            if (initMs > 0) {
                progressRing.style.strokeDashoffset =
                    circumference - ((totalSeconds * 1000) / initMs) * circumference;
            } else {
                progressRing.style.strokeDashoffset = circumference;
            }
        }

        // ---------- Button state ----------
        function setStartButton(state) {
            const text = state === 'running' ? 'Pause' : (state === 'paused' ? 'Resume' : 'Start');
            startBtnText.textContent = text;
            startBtn.setAttribute('aria-label', text + ' egg timer');
            startBtn.classList.toggle('paused', state === 'paused');
            playIcon.style.display  = state === 'running' ? 'none' : 'block';
            pauseIcon.style.display = state === 'running' ? 'block' : 'none';
        }

        function clearPresetActive() {
            document.querySelectorAll('.preset-btn').forEach(b => {
                b.classList.remove('active');
                b.setAttribute('aria-pressed', 'false');
            });
        }

        function applyTheme(type) {
            const theme = PRESETS[type] || PRESETS.soft;
            progressRing.style.stroke = theme.color;
            startBtn.style.backgroundColor = isRunning ? theme.color : (remainingMs > 0 && !isRunning ? '#ff9800' : theme.color);
            startBtn.style.boxShadow = isRunning ? '0 4px 10px ' + theme.soft : '0 4px 10px ' + theme.soft;
            if (!isRunning && remainingMs > 0) {
                startBtn.style.backgroundColor = '#ff9800';
                startBtn.style.boxShadow = '0 4px 10px rgba(255,152,0,0.3)';
            }
        }

        // ---------- Input handling ----------
        function setupNumberInput(input, max) {
            input.addEventListener('keydown', (e) => {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                if (e.key === 'e' || e.key === 'E' || e.key === '+' || e.key === '-' || e.key === '.') {
                    e.preventDefault();
                }
            });

            input.addEventListener('input', () => {
                if (input.value !== '') {
                    const val = parseInt(input.value, 10);
                    if (!isNaN(val)) {
                        if (val > max) input.value = String(max);
                        if (val < 0)  input.value = '0';
                    }
                }
                if (!isRunning) {
                    clearPresetActive();
                    currentType = 'soft';
                    updateTimeFromInputs();
                    savePrefs();
                }
            });

            input.addEventListener('blur', () => {
                let val = parseInt(input.value, 10);
                if (isNaN(val) || val < 0) val = 0;
                if (val > max) val = max;
                input.value = String(val);
            });
        }

        setupNumberInput(inputMinutes, 99);
        setupNumberInput(inputSeconds, 59);

        function updateTimeFromInputs() {
            const m = parseInt(inputMinutes.value, 10) || 0;
            const s = parseInt(inputSeconds.value, 10) || 0;

            totalSeconds = m * 60 + s;
            initialTotalSeconds = totalSeconds;
            remainingMs = 0;

            if (!isRunning) {
                statusText.textContent = 'READY';
                statusText.style.color = 'var(--text-muted)';
                setStartButton('ready');
                applyTheme(currentType);
            }
            updateDisplay();
        }

        // ---------- Preset ----------
        function setPreset(type) {
            if (!PRESETS[type]) return;
            const doApply = () => {
                cancelAnimationFrame(rafId);
                rafId = null;
                clearTimeout(backstopId);
                backstopId = null;
                clearTimeout(zeroMsgTimeout);
                zeroMsgTimeout = null;
                isRunning = false;
                remainingMs = 0;

                currentType = type;
                const minutes = PRESETS[type].minutes;

                inputMinutes.value = String(minutes);
                inputSeconds.value = '0';

                // Update preset button styles
                document.querySelectorAll('.preset-btn').forEach(b => {
                    const active = b.dataset.type === type;
                    b.classList.toggle('active', active);
                    b.setAttribute('aria-pressed', active ? 'true' : 'false');
                });

                updateTimeFromInputs();
                statusText.textContent = 'READY';
                statusText.style.color = 'var(--text-muted)';
                setStartButton('ready');
                applyTheme(type);
                savePrefs();
            };

            if (isRunning || remainingMs > 0) {
                showConfirm('Apply this preset and reset the current timer?').then(ok => {
                    if (ok) doApply();
                });
            } else {
                doApply();
            }
        }

        // ---------- Timer control ----------
        function toggleTimer() {
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            initAudio();

            if (remainingMs <= 0 && totalSeconds <= 0) updateTimeFromInputs();
            const msToRun = remainingMs > 0 ? remainingMs : (totalSeconds * 1000);
            if (msToRun <= 0) {
                statusText.textContent = 'SET TIME';
                statusText.style.color = 'var(--danger)';
                clearTimeout(zeroMsgTimeout);
                zeroMsgTimeout = setTimeout(() => {
                    if (!isRunning && remainingMs <= 0 && totalSeconds <= 0) {
                        statusText.textContent = 'READY';
                        statusText.style.color = 'var(--text-muted)';
                    }
                }, 1500);
                return;
            }

            if (remainingMs <= 0) initialTotalSeconds = totalSeconds;

            targetTime = Date.now() + msToRun;
            remainingMs = msToRun;

            inputMinutes.disabled = true;
            inputSeconds.disabled = true;

            clearTimeout(backstopId);
            backstopId = setTimeout(finishTimer, msToRun);

            isRunning = true;
            statusText.textContent = 'COOKING';
            statusText.style.color = 'var(--egg-medium)';
            setStartButton('running');
            applyTheme(currentType);

            cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(countdownLoop);
        }

        function countdownLoop() {
            if (!isRunning) return;
            const remaining = Math.max(0, targetTime - Date.now());
            remainingMs = remaining;

            const secs = Math.ceil(remaining / 1000);
            if (secs !== totalSeconds) {
                totalSeconds = secs;
                updateCountdownText();
            }

            const initMs = initialTotalSeconds * 1000;
            if (initMs > 0) {
                progressRing.style.strokeDashoffset =
                    circumference - (remaining / initMs) * circumference;
            }

            if (remaining <= 0) {
                finishTimer();
                return;
            }
            rafId = requestAnimationFrame(countdownLoop);
        }

        function finishTimer() {
            if (!isRunning) return;
            cancelAnimationFrame(rafId);
            rafId = null;
            clearTimeout(backstopId);
            backstopId = null;
            isRunning = false;
            remainingMs = 0;
            totalSeconds = 0;
            updateCountdownText();

            statusText.textContent = "🥚 READY!";
            statusText.style.color = 'var(--danger)';
            progressRing.style.stroke = 'var(--danger)';
            progressRing.style.strokeDashoffset = String(circumference);
            setStartButton('ready');

            playBeep();

            inputMinutes.disabled = false;
            inputSeconds.disabled = false;
        }

        function pauseTimer() {
            cancelAnimationFrame(rafId);
            rafId = null;
            clearTimeout(backstopId);
            backstopId = null;

            remainingMs = Math.max(0, targetTime - Date.now());
            if (remainingMs <= 0) {
                finishTimer();
                return;
            }
            isRunning = false;
            totalSeconds = Math.ceil(remainingMs / 1000);
            updateCountdownText();
            const initMs = initialTotalSeconds * 1000;
            if (initMs > 0) {
                progressRing.style.strokeDashoffset =
                    circumference - (remainingMs / initMs) * circumference;
            }
            inputMinutes.disabled = false;
            inputSeconds.disabled = false;

            statusText.textContent = 'PAUSED';
            statusText.style.color = 'var(--text-muted)';
            setStartButton('paused');
            applyTheme(currentType);
        }

        function resetTimer() {
            cancelAnimationFrame(rafId);
            rafId = null;
            clearTimeout(backstopId);
            backstopId = null;
            clearTimeout(zeroMsgTimeout);
            zeroMsgTimeout = null;
            isRunning = false;
            remainingMs = 0;

            inputMinutes.disabled = false;
            inputSeconds.disabled = false;

            updateTimeFromInputs();
            statusText.textContent = 'READY';
            statusText.style.color = 'var(--text-muted)';
            setStartButton('ready');
            applyTheme(currentType);
        }

        function handleReset() {
            if (isRunning || remainingMs > 0) {
                showConfirm('Reset the egg timer?').then(ok => {
                    if (ok) resetTimer();
                });
            } else {
                resetTimer();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            muteBtn.setAttribute('aria-label', isMuted ? 'Unmute' : 'Mute');
            if (isMuted) {
                muteBtn.classList.add('muted');
                soundOnIcon.style.display = 'none';
                soundOffIcon.style.display = 'block';
            } else {
                muteBtn.classList.remove('muted');
                soundOnIcon.style.display = 'block';
                soundOffIcon.style.display = 'none';
            }
        }

        // ---------- Fullscreen ----------
        function getFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
        }

        function enterFullscreen() {
            const el = mainContent;
            const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (!req) {
                if (fsBtn) fsBtn.style.display = 'none';
                return;
            }
            try {
                const p = req.call(el);
                if (p && p.catch) p.catch(() => {});
            } catch (err) { }
        }

        function exitFullscreen() {
            const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (!exit) return;
            try {
                const p = exit.call(document);
                if (p && p.catch) p.catch(() => {});
            } catch (err) { }
        }

        function handleFullscreenChange() {
            const isFs = !!getFullscreenElement();
            if (fsBtn) fsBtn.style.display = isFs ? 'none' : '';
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        // ---------- Dropdowns ----------
        function toggleToolsDropdown() {
            const isOpen = toolsDropdown.classList.toggle('show');
            toolsBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            if (isOpen) {
                langDropdown.classList.remove('show');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        }

        function toggleLangDropdown() {
            const isOpen = langDropdown.classList.toggle('show');
            langBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            if (isOpen) {
                toolsDropdown.classList.remove('show');
                toolsBtn.setAttribute('aria-expanded', 'false');
            }
        }

        document.addEventListener('click', (e) => {
            if (!toolsBtn.contains(e.target) && !toolsDropdown.contains(e.target)) {
                toolsDropdown.classList.remove('show');
                toolsBtn.setAttribute('aria-expanded', 'false');
            }
            if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
                langDropdown.classList.remove('show');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('click', (e) => {
            if (e.detail > 0 && e.target instanceof Element) {
                const btn = e.target.closest('button');
                if (btn) btn.blur();
            }
        });

        // ---------- Keyboard shortcuts ----------
        document.addEventListener('keydown', (e) => {
            if (modalResolve) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                    closeModal(false);
                }
                return;
            }

            if (e.repeat) return;
            const el = e.target instanceof Element ? e.target : document.body;
            if (el.closest('button, a, input, textarea, select, [contenteditable="true"]')) return;

            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                toggleTimer();
                return;
            }

            if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                handleReset();
                return;
            }

            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                if (getFullscreenElement()) exitFullscreen();
                else enterFullscreen();
                return;
            }

            if (e.key === 'Escape') {
                if (getFullscreenElement()) exitFullscreen();
                return;
            }
        });

        // ---------- Init ----------
        loadPrefs();

        // Set active preset based on current type
        document.querySelectorAll('.preset-btn').forEach(b => {
            const active = b.dataset.type === currentType;
            b.classList.toggle('active', active);
            b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });

        updateTimeFromInputs();
        applyTheme(currentType);
    </script>
</body>
</html>
