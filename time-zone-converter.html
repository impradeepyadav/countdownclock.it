    <style>

            --green-primary: #4caf50;

            --blue-primary: #3b82f6;
            --gray-light: #f3f4f6;

            --border-color: #e5e7eb;
            --danger: #ef4444;
            --shadow-color: rgba(0,0,0,0.1);

            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body { user-select: none; -webkit-user-select: none; }
        input, textarea, h1, p, a, .header-text {

            -webkit-user-select: text;

        html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        body {

            color: var(--text-main);

            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;

        }

        .container {
            background: var(--card-bg);
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            flex-direction: column;

        /* ================= SITE HEADER ================= */

            align-items: flex-start;

        .brand {

            flex-shrink: 0;
            gap: clamp(12px, 2vh, 20px);
            min-width: 0;

        /* ================= CONVERTER CARD ================= */

            gap: clamp(8px, 1.5vw, 16px);
            align-items: center;

        /* ================= DATETIME ROW ================= */
        .datetime-row {

            grid-template-columns: 1fr 1fr auto;
            gap: clamp(8px, 1.5vw, 14px);
            align-items: flex-end;
        }

        .datetime-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .datetime-field label {
            font-size: clamp(10px, min(1.5vh, 2.8vw), 12px);
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .datetime-field input {
            width: 100%;
            font-family: inherit;
            font-size: clamp(13px, min(1.9vh, 3.4vw), 15px);
            font-weight: 600;
            color: var(--text-main);
            background-color: var(--gray-light);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: clamp(9px, 1.4vh, 12px) clamp(10px, 1.6vw, 14px);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-width: 0;
            font-variant-numeric: tabular-nums;
        }

        .datetime-field input:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15);
        }

        .btn-now {
            padding: clamp(9px, 1.4vh, 12px) clamp(14px, 2.5vw, 20px);
            border-radius: 12px;
            font-size: clamp(13px, min(1.9vh, 3.4vw), 15px);
            font-weight: 700;
            color: var(--text-main);
            background-color: var(--gray-light);
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            align-self: flex-end;
            height: fit-content;
            touch-action: manipulation;
            white-space: nowrap;
        }

        .btn-now:hover {
            background-color: var(--gray-hover);
            transform: translateY(-1px);
        }

        /* ================= RESULT CARD ================= */
        .result-card {
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            border: 2px solid rgba(76, 175, 80, 0.2);
            border-radius: 18px;
            padding: clamp(14px, 2.5vh, 22px) clamp(16px, 2.5vw, 24px);

            flex-direction: column;
            gap: 6px;

        .result-header {

            font-weight: 700;
            color: var(--green-hover);

            text-transform: uppercase;
        }

        .format-toggle {
            display: inline-flex;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2px;
            gap: 1px;
            box-shadow: 0 1px 3px var(--shadow-color);
        }

        .fmt-btn {
            background: transparent;
            border: none;
            padding: 5px 12px;
            border-radius: 18px;
            font-size: clamp(11px, min(1.7vh, 3vw), 13px);
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            touch-action: manipulation;
            line-height: 1.2;
        }

        .fmt-btn:hover { color: var(--text-main); }
        .fmt-btn.active {
            background-color: var(--green-primary);
            color: white;
        }

        .result-time {
            font-family: 'Outfit', 'Inter', sans-serif;
            font-size: clamp(2.4rem, min(8vh, 13vw), 4.2rem);
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            white-space: nowrap;
        }

        .result-date {
            font-size: clamp(13px, min(2vh, 3.6vw), 17px);
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.35;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: clamp(11px, min(1.7vh, 3vw), 14px);
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .result-zone {
            font-weight: 700;
            color: var(--green-hover);
        }

        .result-dot { opacity: 0.5; }

        .result-daydiff {
            font-weight: 600;
            color: var(--text-main);
            background: rgba(76, 175, 80, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: clamp(10px, min(1.5vh, 2.8vw), 12px);
        }

        /* ================= CONTROLS ================= */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            flex-shrink: 0;
            width: 100%;
            min-width: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2vw, 20px);
            flex-wrap: wrap;
            max-width: 100%;
            min-width: 0;
        }

        .btn-icon {
            width: clamp(44px, min(6.8vh, 10vw), 58px);
            height: clamp(44px, min(6.8vh, 10vw), 58px);
            border-radius: 50%;
            background-color: var(--gray-light);
            color: var(--text-muted);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background-color: var(--gray-hover);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .hint {
            font-size: clamp(12px, min(1.9vh, 3.4vw), 16px);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            text-align: center;
            max-width: 100%;
            padding: 0 4px;
        }

        .hint kbd {
            background-color: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: inherit;
            font-size: clamp(11px, min(1.7vh, 3vw), 15px);
            font-weight: 700;
            color: var(--text-main);
        }

        svg.icon {
            width: clamp(18px, min(2.5vh, 4.2vw), 24px);
            height: clamp(18px, min(2.5vh, 4.2vw), 24px);
            fill: currentColor;
            flex-shrink: 0;
        }

        svg.hint-icon {
            width: clamp(14px, min(2.1vh, 3.4vw), 18px);
            height: clamp(14px, min(2.1vh, 3.4vw), 18px);
            flex-shrink: 0;
        }

        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--blue-primary);
            outline-offset: 2px;
        }

        /* ================= FULLSCREEN ================= */
        .main-content:fullscreen,
        .main-content:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            padding: clamp(14px, 2.5vh, 32px) clamp(12px, 3vw, 40px);
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(14px, 2.5vh, 26px);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .main-content:fullscreen .hint,
        .main-content:-webkit-full-screen .hint {
            display: none !important;
        }

        .main-content:fullscreen .converter-card,
        .main-content:-webkit-full-screen .converter-card {
            max-width: 900px;
            padding: clamp(20px, 3.5vh, 40px);
        }

        .main-content:fullscreen .result-time,
        .main-content:-webkit-full-screen .result-time {
            font-size: clamp(3.2rem, min(12vh, 16vw), 6.5rem);
        }

        .main-content:fullscreen .result-date,
        .main-content:-webkit-full-screen .result-date {
            font-size: clamp(16px, min(2.8vh, 4.5vw), 24px);
        }

        .fs-exit-btn {
            display: none;
            position: fixed;
            top: 18px;
            right: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            color: var(--text-main);
            border: none;
            cursor: pointer;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.15s ease, opacity 0.15s ease;
            touch-action: manipulation;
            opacity: 0.7;
        }

        .fs-exit-btn:hover, .fs-exit-btn:focus-visible {
            opacity: 1;
            transform: scale(1.08);
            outline: none;
        }

        .fs-exit-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
            pointer-events: none;
        }

        .main-content:fullscreen .fs-exit-btn,
        .main-content:-webkit-full-screen .fs-exit-btn {
            display: flex;
        }

        /* ================= HEADER LINKS ================= */
        .privacy-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(12px, min(1.7vh, 3vw), 14px);
            font-weight: 300;
            transition: color 0.2s;
            display: inline-block;
            padding: 4px 2px;
            white-space: nowrap;
            line-height: 1.2;
        }

        .privacy-link:hover { color: var(--text-main); }

        .lang-dropdown, .tools-dropdown { position: relative; }

        .lang-btn, .tools-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: clamp(12px, min(1.7vh, 3vw), 14px);
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
            padding: 4px 2px;
            font-family: inherit;
            line-height: 1.2;
        }

        .lang-btn:hover, .tools-btn:hover { color: var(--text-main); }

        .caret { font-size: 8px; margin-top: 2px; }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background-color: var(--card-bg);
            min-width: 140px;
            max-width: calc(100vw - 24px);
            box-shadow: 0 4px 15px var(--shadow-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            font-weight: 300;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .dropdown-content a:hover { background-color: var(--gray-light); }
        .dropdown-content.show { display: block; }

        .dropdown-content.tools-content {
            min-width: 200px;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .site-header { flex-direction: column; align-items: center; text-align: center; gap: 12px; }
            .brand { flex-direction: column; align-items: center; text-align: center; max-width: 100%; }
            .top-controls { justify-content: center; padding-top: 0; }
            .dropdown-content { right: auto; left: 50%; transform: translateX(-50%); }

            .zone-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .swap-btn {
                margin-top: 0;
                justify-self: center;
                transform: rotate(90deg);
            }
            .swap-btn:hover { transform: rotate(270deg); }

            .datetime-row {
                grid-template-columns: 1fr 1fr;
            }
            .datetime-row .btn-now {
                grid-column: 1 / -1;
                justify-self: stretch;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .container { padding: 14px 12px 12px; }
            .fs-exit-btn { width: 38px; height: 38px; top: 12px; right: 12px; }
            .fs-exit-btn svg { width: 24px; height: 24px; }
            .converter-card { padding: 14px; border-radius: 18px; }
        }

        @media (max-width: 380px) {
            .btn-icon { width: 44px; height: 44px; }
            .controls { gap: 8px; }
            .top-controls { gap: 4px; }
            .result-time { letter-spacing: -1px; }
        }

        @media (max-height: 520px) {
            .site-header p { display: none; }
            .container { gap: 8px; padding-top: 10px; }
            .main-content { gap: 8px; }
            .result-time { font-size: clamp(1.8rem, 9vh, 3rem); }
        }

        // ---------- Timezone data ----------

            { zone: 'Asia/Kolkata',              group: 'Asia',        label: 'Mumbai / New Delhi' },
            { zone: 'Asia/Karachi',              group: 'Asia',        label: 'Karachi' },
            { zone: 'Asia/Dhaka',                group: 'Asia',        label: 'Dhaka' },
            { zone: 'Asia/Kathmandu',            group: 'Asia',        label: 'Kathmandu' },
            { zone: 'Asia/Bangkok',              group: 'Asia',        label: 'Bangkok' },
            { zone: 'Asia/Jakarta',              group: 'Asia',        label: 'Jakarta' },
            { zone: 'Asia/Singapore',            group: 'Asia',        label: 'Singapore' },
            { zone: 'Asia/Hong_Kong',            group: 'Asia',        label: 'Hong Kong' },
            { zone: 'Asia/Shanghai',             group: 'Asia',        label: 'Shanghai / Beijing' },
            { zone: 'Asia/Taipei',               group: 'Asia',        label: 'Taipei' },
            { zone: 'Asia/Seoul',                group: 'Asia',        label: 'Seoul' },
            { zone: 'Asia/Tokyo',                group: 'Asia',        label: 'Tokyo' },
            { zone: 'Asia/Manila',               group: 'Asia',        label: 'Manila' },
            { zone: 'Australia/Perth',           group: 'Oceania',     label: 'Perth' },
            { zone: 'Australia/Adelaide',        group: 'Oceania',     label: 'Adelaide' },
            { zone: 'Australia/Brisbane',        group: 'Oceania',     label: 'Brisbane' },
            { zone: 'Australia/Sydney',          group: 'Oceania',     label: 'Sydney' },
            { zone: 'Australia/Melbourne',       group: 'Oceania',     label: 'Melbourne' },
            { zone: 'Pacific/Auckland',          group: 'Oceania',     label: 'Auckland' },
            { zone: 'Pacific/Fiji',              group: 'Oceania',     label: 'Fiji' },
            { zone: 'Pacific/Honolulu',          group: 'Oceania',     label: 'Honolulu' },
        ];

        const STORAGE_KEY = 'timerclock_tzconverter_prefs_v1';
        let timeFormat = '12';  // '12' or '24'
        let currentResultInstant = null;  // UTC ms of the current result
        let liveInterval = null;

        // ---------- Helpers: timezone math ----------
        function getWallComponents(date, zone) {
            const dtf = new Intl.DateTimeFormat('en-US', {
                timeZone: zone,
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            });
            const parts = dtf.formatToParts(date);
            const o = {};
            for (const p of parts) o[p.type] = p.value;
            let h = parseInt(o.hour, 10);
            if (h === 24) h = 0;
            return {
                year:   parseInt(o.year, 10),
                month:  parseInt(o.month, 10),
                day:    parseInt(o.day, 10),
                hour:   h,
                minute: parseInt(o.minute, 10),
                second: parseInt(o.second, 10)
            };
        }

        function zonedTimeToUtc(year, month, day, hour, minute, second, zone) {
            // Find the UTC instant that equals the given wall-clock time in `zone`.
            // Iteratively converges even across DST transitions.
            const naiveUtcMs = Date.UTC(year, month - 1, day, hour, minute, second || 0);
            let guess = naiveUtcMs;

            for (let i = 0; i < 5; i++) {
                const wall = getWallComponents(new Date(guess), zone);
                const wallMs = Date.UTC(wall.year, wall.month - 1, wall.day, wall.hour, wall.minute, wall.second);
                const diff = naiveUtcMs - wallMs;
                if (Math.abs(diff) < 1000) return guess;
                guess += diff;
            }
            return guess;
        }

        function getOffsetMinutes(date, zone) {
            const wall = getWallComponents(date, zone);
            const asUtc = Date.UTC(wall.year, wall.month - 1, wall.day, wall.hour, wall.minute, wall.second);
            return Math.round((asUtc - date.getTime()) / 60000);
        }

        function formatOffset(minutes) {
            if (minutes === 0) return 'UTC';
            const sign = minutes >= 0 ? '+' : '-';
            const abs = Math.abs(minutes);
            const h = Math.floor(abs / 60);
            const m = abs % 60;
            return 'UTC' + sign + h + (m ? ':' + String(m).padStart(2, '0') : '');
        }

        function getCalendarDateKey(utcMs, zone) {
            const wall = getWallComponents(new Date(utcMs), zone);
            return wall.year + '-' + String(wall.month).padStart(2, '0') + '-' + String(wall.day).padStart(2, '0');
        }

        function getZoneAbbrev(utcMs, zone) {
            try {
                const dtf = new Intl.DateTimeFormat('en-US', {
                    timeZone: zone,
                    timeZoneName: 'short'
                });
                const parts = dtf.formatToParts(new Date(utcMs));
                for (const p of parts) {
                    if (p.type === 'timeZoneName') return p.value;
                }
            } catch (e) { /* ignore */ }
            return '';
        }

        // ---------- Populate selects ----------
        function populateSelect(selectEl, selectedValue) {
            const groups = {};
            ZONES.forEach(z => {
                if (!groups[z.group]) groups[z.group] = [];
                groups[z.group].push(z);
            });
            const groupOrder = ['UTC', 'Americas', 'Europe', 'Africa & Middle East', 'Asia', 'Oceania'];

            let html = '';
            groupOrder.forEach(groupName => {
                const items = groups[groupName];
                if (!items) return;
                html += '<optgroup label="' + groupName + '">';
                items.forEach(z => {
                    html += '<option value="' + z.zone + '">' + z.label + '</option>';
                });
                html += '</optgroup>';
            });
            selectEl.innerHTML = html;
            if (selectedValue) selectEl.value = selectedValue;
        }

        // ---------- Format preference ----------
        function loadPrefs() {
            let prefs = {};
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) prefs = JSON.parse(raw) || {};
            } catch (e) { /* ignore */ }

            if (prefs.format === '12' || prefs.format === '24') timeFormat = prefs.format;

            return prefs;
        }

        function savePrefs() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    source: sourceSelect.value,
                    target: targetSelect.value,
                    format: timeFormat
                }));
            } catch (e) { /* ignore */ }
        }

        function setFormat(fmt) {
            if (fmt !== '12' && fmt !== '24') return;
            timeFormat = fmt;

            if (fmt === '12') {
                fmt12.classList.add('active');
                fmt12.setAttribute('aria-pressed', 'true');
                fmt24.classList.remove('active');
                fmt24.setAttribute('aria-pressed', 'false');
            } else {
                fmt24.classList.add('active');
                fmt24.setAttribute('aria-pressed', 'true');
                fmt12.classList.remove('active');
                fmt12.setAttribute('aria-pressed', 'false');
            }

            savePrefs();
            convert();
            updateLiveClocks();
        }

        // ---------- Conversion ----------
        function convert() {
            const srcZone = sourceSelect.value;
            const dstZone = targetSelect.value;
            const dateVal = dateInput.value;
            const timeVal = timeInput.value;

            if (!srcZone || !dstZone || !dateVal || !timeVal) {
                clearResult();
                return;
            }

            const dateParts = dateVal.split('-').map(Number);
            const timeParts = timeVal.split(':').map(Number);
            if (dateParts.length < 3 || timeParts.length < 2) {
                clearResult();
                return;
            }

            const [y, mo, d] = dateParts;
            const [h, mi] = timeParts;

            if (!isFinite(y) || !isFinite(mo) || !isFinite(d) || !isFinite(h) || !isFinite(mi)) {
                clearResult();
                return;
            }

            const resultInstant = zonedTimeToUtc(y, mo, d, h, mi, 0, srcZone);
            currentResultInstant = resultInstant;

            const srcDateKey = y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
            renderResult(resultInstant, srcDateKey, dstZone);
        }

        function clearResult() {
            currentResultInstant = null;
            resultTime.textContent = '--:--';
            resultDate.textContent = 'Pick a date and time';
            resultZone.textContent = '';
            resultOffset.textContent = '';
            resultDayDiff.style.display = 'none';
            resultDot1.style.display = 'none';
            resultDot2.style.display = 'none';
        }

        function renderResult(utcMs, srcDateKey, dstZone) {
            const date = new Date(utcMs);
            const use12 = timeFormat === '12';

            // Time
            const timeFmt = new Intl.DateTimeFormat('en-US', {
                timeZone: dstZone,
                hour: 'numeric',
                minute: '2-digit',
                hour12: use12
            });
            resultTime.textContent = timeFmt.format(date);

            // Date
            const dateFmt = new Intl.DateTimeFormat('en-US', {
                timeZone: dstZone,
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });
            resultDate.textContent = dateFmt.format(date);

            // Zone abbreviation
            const abbr = getZoneAbbrev(utcMs, dstZone);
            resultZone.textContent = abbr;

            // Offset
            const offset = getOffsetMinutes(date, dstZone);
            resultOffset.textContent = formatOffset(offset);

            // Day difference
            const dstDateKey = getCalendarDateKey(utcMs, dstZone);
            if (srcDateKey === dstDateKey) {
                resultDayDiff.textContent = 'Same day';
                resultDayDiff.style.display = '';
                resultDot1.style.display = '';
                resultDot2.style.display = '';
            } else {
                const srcMs = Date.parse(srcDateKey + 'T00:00:00Z');
                const dstMs = Date.parse(dstDateKey + 'T00:00:00Z');
                const diffDays = Math.round((dstMs - srcMs) / 86400000);
                let label;
                if (diffDays === 1) label = 'Next day';
                else if (diffDays === -1) label = 'Previous day';
                else if (diffDays > 1) label = '+' + diffDays + ' days';
                else label = diffDays + ' days';
                resultDayDiff.textContent = label;
                resultDayDiff.style.display = '';
                resultDot1.style.display = '';
                resultDot2.style.display = '';
            }
        }

        // ---------- Live clocks ----------
        function formatLive(date, zone) {
            const dtf = new Intl.DateTimeFormat('en-US', {
                timeZone: zone,
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: timeFormat === '12'
            });
            return dtf.format(date);
        }

        function updateLiveClocks() {
            const now = new Date();
            const srcZone = sourceSelect.value;
            const dstZone = targetSelect.value;
            if (!srcZone || !dstZone) return;

            try {
                sourceNow.textContent = 'Now: ' + formatLive(now, srcZone);
                targetNow.textContent = 'Now: ' + formatLive(now, dstZone);
            } catch (e) { /* ignore */ }
        }

        // ---------- Now button ----------
        function setNow() {
            const srcZone = sourceSelect.value;
            const now = new Date();
            const wall = getWallComponents(now, srcZone);

            dateInput.value =
                wall.year + '-' +
                String(wall.month).padStart(2, '0') + '-' +
                String(wall.day).padStart(2, '0');
            timeInput.value =
                String(wall.hour).padStart(2, '0') + ':' +
                String(wall.minute).padStart(2, '0');

            convert();
        }

        // ---------- Swap ----------
        function swapZones() {
            if (!currentResultInstant) {
                // Nothing to preserve; just swap the selects
                const oldSrc = sourceSelect.value;
                sourceSelect.value = targetSelect.value;
                targetSelect.value = oldSrc;
                savePrefs();
                convert();
                return;
            }

            const oldSrc = sourceSelect.value;
            const oldTgt = targetSelect.value;

            // Swap the selects
            sourceSelect.value = oldTgt;
            targetSelect.value = oldSrc;

            // Set the input to the previous result time expressed in the new source (old target) zone
            const wall = getWallComponents(new Date(currentResultInstant), oldTgt);
            dateInput.value =
                wall.year + '-' +
                String(wall.month).padStart(2, '0') + '-' +
                String(wall.day).padStart(2, '0');
            timeInput.value =
                String(wall.hour).padStart(2, '0') + ':' +
                String(wall.minute).padStart(2, '0');

            savePrefs();
            convert();
            updateLiveClocks();
        }

        // ---------- Fullscreen ----------
        function getFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
        }

        function enterFullscreen() {
            const el = mainContent;
            const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (!req) {
                if (fsBtn) fsBtn.style.display = 'none';
                return;
            }
            try {
                const p = req.call(el);
                if (p && p.catch) p.catch(() => {});
            } catch (err) { }
        }

        function exitFullscreen() {
            const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (!exit) return;
            try {
                const p = exit.call(document);
                if (p && p.catch) p.catch(() => {});
            } catch (err) { }
        }

        function handleFullscreenChange() {
            const isFs = !!getFullscreenElement();
            if (fsBtn) fsBtn.style.display = isFs ? 'none' : '';
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        // ---------- Dropdowns ----------
        function toggleToolsDropdown() {
            const isOpen = toolsDropdown.classList.toggle('show');
            toolsBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            if (isOpen) {
                langDropdown.classList.remove('show');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        }

        function toggleLangDropdown() {
            const isOpen = langDropdown.classList.toggle('show');
            langBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            if (isOpen) {
                toolsDropdown.classList.remove('show');
                toolsBtn.setAttribute('aria-expanded', 'false');
            }
        }

        document.addEventListener('click', (e) => {
            if (!toolsBtn.contains(e.target) && !toolsDropdown.contains(e.target)) {
                toolsDropdown.classList.remove('show');
                toolsBtn.setAttribute('aria-expanded', 'false');
            }
            if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
                langDropdown.classList.remove('show');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('click', (e) => {
            if (e.detail > 0 && e.target instanceof Element) {
                const btn = e.target.closest('button');
                if (btn) btn.blur();
            }
        });

        // ---------- Keyboard shortcuts ----------
        document.addEventListener('keydown', (e) => {
            const el = e.target instanceof Element ? e.target : document.body;
            if (el.closest('input, textarea, select, [contenteditable="true"]')) return;
            if (e.repeat) return;

            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                if (getFullscreenElement()) exitFullscreen();
                else enterFullscreen();
                return;
            }

            if (e.key === 'Escape') {
                if (getFullscreenElement()) exitFullscreen();
                return;
            }
        });

        // ---------- Input listeners ----------
        dateInput.addEventListener('change', () => { convert(); });
        timeInput.addEventListener('change', () => { convert(); });
        dateInput.addEventListener('input', () => { convert(); });
        timeInput.addEventListener('input', () => { convert(); });

        sourceSelect.addEventListener('change', () => {
            savePrefs();
            convert();
            updateLiveClocks();
        });

        targetSelect.addEventListener('change', () => {
            savePrefs();
            convert();
            updateLiveClocks();
        });

        // ---------- Init ----------
        (function init() {
            const prefs = loadPrefs();

            // Detect user's timezone
            let detectedZone = 'UTC';
            try {
                detectedZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
            } catch (e) { /* ignore */ }

            // Validate that detected zone exists in our list
            const knownZones = ZONES.map(z => z.zone);
            if (!knownZones.includes(detectedZone)) {
                detectedZone = 'UTC';
            }

            // Determine initial zones
            let srcZone = prefs.source && knownZones.includes(prefs.source) ? prefs.source : detectedZone;
            let tgtZone = prefs.target && knownZones.includes(prefs.target) ? prefs.target : 'Europe/London';

            // If source and target end up equal, pick a sensible alternative
            if (srcZone === tgtZone) {
                tgtZone = srcZone === 'Europe/London' ? 'America/New_York' : 'Europe/London';
            }

            populateSelect(sourceSelect, srcZone);
            populateSelect(targetSelect, tgtZone);

            // Set format button state
            if (timeFormat === '24') {
                fmt24.classList.add('active');
                fmt24.setAttribute('aria-pressed', 'true');
                fmt12.classList.remove('active');
                fmt12.setAttribute('aria-pressed', 'false');
            }

            // Set "now" as default input
            setNow();

            // Start live clocks
            updateLiveClocks();
            if (liveInterval) clearInterval(liveInterval);
            liveInterval = setInterval(updateLiveClocks, 1000);
        })();
    </script>
</body>
</html>
