<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Clock Timer & Stopwatch</title>
    <meta name="description" content="Free online countdown clock timer and stopwatch with a visual ring. Perfect for cooking, study sprints, meetings, and workouts.">
    <link rel="canonical" href="https://countdownclock.it/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Added all font-weights for thin text support -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --green-primary: #4caf50;
            --green-hover: #43a047;
            --blue-primary: #3b82f6;
            --blue-hover: #2563eb;
            --gray-light: #f3f4f6;
            --gray-hover: #e5e7eb;
            --border-color: #e5e7eb;
            --danger: #ef4444;
            --shadow-color: rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        html { height: 100%; }

        body {
            background-color: var(--card-bg);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3vh 4vw 2vh;
            gap: clamp(10px, 2vh, 20px);
        }

        /* ---------- Top Bar (Header + Right Controls) ---------- */
        .top-bar {
            width: 100%;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 20px;
            flex-shrink: 0;
            padding-right: 1vw;
        }

        .header {
            text-align: left;
            max-width: 800px;
        }

        .header h1 {
            font-size: clamp(26px, min(4.4vh, 7vw), 42px);
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 0.5vh;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .header p {
            font-size: clamp(14px, min(2vh, 3.8vw), 18px);
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Top Right Controls */
        .top-controls {
            display: flex;
            align-items: center;
            gap: clamp(12px, 1.8vw, 22px);
            padding-top: 10px;
        }

        /* Font weight 200 (Extra Thin) */
        .privacy-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(12px, min(1.6vh, 3vw), 14px);
            font-weight: 200;
            transition: color 0.2s;
        }

        .privacy-link:hover {
            color: var(--text-main);
        }

        .lang-dropdown { position: relative; }

        .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: clamp(12px, min(1.6vh, 3vw), 14px);
            font-weight: 200;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
            padding: 0;
        }

        .lang-btn:hover { color: var(--text-main); }

        .caret { font-size: 8px; margin-top: 2px; }

        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background-color: var(--card-bg);
            min-width: 130px;
            box-shadow: 0 4px 15px var(--shadow-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 8px 14px;
            text-decoration: none;
            display: block;
            font-size: 13px;
            font-weight: 200;
            transition: background-color 0.2s;
        }

        .dropdown-content a:hover { background-color: var(--gray-light); }
        .dropdown-content.show { display: block; }

        /* ---------- Main area ---------- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            flex-grow: 1;
            flex-shrink: 0;
            gap: clamp(10px, 2vh, 20px);
        }

        /* ---------- Mode Switch (Countdown / Stopwatch) ---------- */
        .mode-switch {
            display: flex;
            background-color: var(--gray-light);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 5px;
        }

        .mode-btn {
            padding: 8px 20px;
            border-radius: 25px;
            border: none;
            background: transparent;
            font-size: clamp(13px, min(1.9vh, 3.4vw), 16px);
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        /* ---------- Presets ---------- */
        .presets {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(8px, 1.2vw, 14px);
            width: 100%;
        }

        .preset-btn {
            background-color: var(--gray-light);
            color: var(--text-muted);
            border: none;
            padding: 0.7vh 1.5vw;
            border-radius: 20px;
            font-size: clamp(13px, min(2vh, 3.6vw), 17px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .preset-btn:hover {
            background-color: var(--gray-hover);
            color: var(--text-main);
        }

        /* ---------- Timer ring ---------- */
        .timer-display {
            position: relative;
            width: clamp(200px, min(36vh, 74vw), 350px);
            height: clamp(200px, min(36vh, 74vw), 350px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 1vh 0;
            flex-shrink: 0;
        }

        .ring-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg { fill: none; stroke: var(--gray-light); stroke-width: 12; }

        .ring-progress {
            fill: none;
            stroke: var(--green-primary);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 817;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
        }

        .ring-progress.stopwatch-mode {
            stroke: var(--blue-primary);
        }

        /* ---------- Big time digits ---------- */
        .time-text {
            font-size: clamp(2rem, min(6.5vh, 10.5vw), 3.9rem);
            font-weight: 900;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            z-index: 10;
            line-height: 1;
            margin-bottom: 0.4vh;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .time-text .ms-text {
            font-size: clamp(1.1rem, min(3.2vh, 5.5vw), 2.1rem);
            color: var(--text-muted);
            margin-left: 2px;
        }

        .status-text {
            font-size: clamp(12px, min(1.8vh, 3.4vw), 17px);
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 2px;
            z-index: 10;
            text-transform: uppercase;
        }

        /* ---------- Inputs ---------- */
        .input-group {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: clamp(10px, 2vw, 25px);
            flex-wrap: wrap;
        }

        .input-wrapper { display: flex; flex-direction: column; align-items: center; }

        .input-wrapper label {
            font-size: clamp(11px, min(1.7vh, 3.2vw), 15px);
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 0.8vh;
        }

        .input-wrapper input {
            width: clamp(70px, 22vw, 110px);
            height: clamp(50px, min(8vh, 13vw), 78px);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: clamp(1.3rem, min(3.6vh, 6.8vw), 2.2rem);
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
            outline: none;
            background-color: var(--card-bg);
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15);
        }

        .input-wrapper input:disabled {
            background-color: var(--gray-light);
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        .input-wrapper input::-webkit-outer-spin-button,
        .input-wrapper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .colon {
            font-size: clamp(1.3rem, min(3.6vh, 6.8vw), 2.2rem);
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 2vh;
        }

        /* ---------- Laps List ---------- */
        .laps-container {
            width: 100%;
            max-width: 320px;
            height: clamp(60px, 12vh, 130px);
            overflow-y: auto;
            border-radius: 12px;
            flex-shrink: 0;
            margin-top: 5px;
        }

        .laps-container::-webkit-scrollbar { width: 6px; }
        .laps-container::-webkit-scrollbar-thumb { background-color: var(--gray-hover); border-radius: 10px; }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--gray-light);
            font-size: clamp(13px, min(1.9vh, 3.4vw), 16px);
            font-weight: 600;
            color: var(--text-main);
        }

        .lap-item span:first-child { color: var(--text-muted); }

        /* ---------- Controls ---------- */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            flex-shrink: 0;
            width: 100%;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2vw, 20px);
            flex-wrap: wrap;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: clamp(11px, min(1.8vh, 3vw), 16px) clamp(20px, 5vw, 38px);
            border-radius: 30px;
            font-size: clamp(15px, min(2.4vh, 4.2vw), 20px);
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .btn-start {
            background-color: var(--green-primary);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .btn-start:hover {
            background-color: var(--green-hover);
            transform: translateY(-2px);
        }

        .btn-start.paused {
            background-color: #ff9800;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }

        .btn-start.sw-mode {
            background-color: var(--blue-primary);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .btn-start.sw-mode:hover { background-color: var(--blue-hover); }

        .btn-reset {
            background-color: var(--gray-light);
            color: var(--text-main);
        }

        .btn-reset:hover {
            background-color: var(--gray-hover);
            transform: translateY(-2px);
        }

        .btn-icon {
            width: clamp(45px, min(6.8vh, 10vw), 58px);
            height: clamp(45px, min(6.8vh, 10vw), 58px);
            border-radius: 50%;
            background-color: var(--gray-light);
            color: var(--text-muted);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-icon:hover {
            background-color: var(--gray-hover);
            color: var(--text-main);
        }

        .btn-icon.muted {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .hint {
            font-size: clamp(12px, min(1.9vh, 3.4vw), 17px);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            text-align: center;
        }

        .hint kbd {
            background-color: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: inherit;
            font-size: clamp(11px, min(1.7vh, 3vw), 15px);
            font-weight: 700;
            color: var(--text-main);
        }

        /* SVGs */
        svg.icon {
            width: clamp(18px, min(2.5vh, 4.2vw), 24px);
            height: clamp(18px, min(2.5vh, 4.2vw), 24px);
            fill: currentColor;
        }
        
        svg.hint-icon {
            width: clamp(14px, min(2.1vh, 3.4vw), 18px);
            height: clamp(14px, min(2.1vh, 3.4vw), 18px);
        }

        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        /* ---------- Mobile adjustments ---------- */
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 15px;
                padding-right: 0;
            }
            .header { text-align: center; }
            .top-controls { justify-content: center; padding-top: 0; }
            .dropdown-content {
                right: auto;
                left: 50%;
                transform: translateX(-50%);
            }
        }

        @media (max-width: 640px) {
            .container { padding: 2.4vh 4vw; }
            .controls-wrapper { gap: 1.2vh; }
        }

        @media (max-width: 360px) {
            .container { padding: 2vh 3vw; }
            .preset-btn { padding: 0.6vh 3.2vw; }
        }

        @media (max-height: 520px) {
            .header p { display: none; }
            .container { gap: 8px; }
            .timer-display { width: clamp(150px, min(48vh, 56vw), 240px); height: clamp(150px, min(48vh, 56vw), 240px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar (Header + Right Controls) -->
        <div class="top-bar">
            <div class="header">
                <h1>Countdown Clock Timer</h1>
                <p>Set any duration and count down with a visual ring. Perfect for cooking, study sprints, meetings, and workouts.</p>
            </div>
            
            <div class="top-controls">
                <div class="lang-dropdown">
                    <button class="lang-btn" id="langBtn" onclick="toggleLangDropdown(event)">
                        <span id="langLabel">English (US)</span> <span class="caret">▼</span>
                    </button>
                    <div class="dropdown-content" id="langDropdown">
                        <a href="#" onclick="changeLang(event, 'English (US)')">English (US)</a>
                        <a href="#" onclick="changeLang(event, 'Español')">Español</a>
                        <a href="#" onclick="changeLang(event, 'Français')">Français</a>
                        <a href="#" onclick="changeLang(event, 'Deutsch')">Deutsch</a>
                        <a href="#" onclick="changeLang(event, 'हिंदी')">हिंदी</a>
                    </div>
                </div>
                <a href="/privacy" class="privacy-link">Privacy</a>
            </div>
        </div>

        <!-- Main Center Area -->
        <div class="main-content">

            <!-- Mode Switcher (Countdown / Stopwatch) -->
            <div class="mode-switch">
                <button class="mode-btn active" id="btnModeCountdown" onclick="switchMode('countdown')">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    Countdown
                </button>
                <button class="mode-btn" id="btnModeStopwatch" onclick="switchMode('stopwatch')">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9a8.994 8.994 0 0 0 7.03-14.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
                    Stopwatch
                </button>
            </div>

            <!-- Presets (Only Countdown) -->
            <div class="presets" id="presetsSection">
                <button class="preset-btn" onclick="setPreset(1)">1 min</button>
                <button class="preset-btn" onclick="setPreset(5)">5 min</button>
                <button class="preset-btn" onclick="setPreset(10)">10 min</button>
                <button class="preset-btn" onclick="setPreset(15)">15 min</button>
                <button class="preset-btn" onclick="setPreset(25)">25 min</button>
                <button class="preset-btn" onclick="setPreset(30)">30 min</button>
                <button class="preset-btn" onclick="setPreset(45)">45 min</button>
                <button class="preset-btn" onclick="setPreset(60)">1 hr</button>
            </div>

            <!-- Timer Display -->
            <div class="timer-display">
                <svg class="ring-svg" viewBox="0 0 280 280">
                    <circle class="ring-bg" cx="140" cy="140" r="130"></circle>
                    <circle class="ring-progress" id="progressRing" cx="140" cy="140" r="130"></circle>
                </svg>
                <div class="time-text" id="timeDisplay" role="timer" aria-live="off">00:00:00</div>
                <div class="status-text" id="statusText">READY</div>
            </div>

            <!-- Inputs (Only Countdown) -->
            <div class="input-group" id="inputsSection">
                <div class="input-wrapper">
                    <label for="inputHours">HOURS</label>
                    <input type="number" id="inputHours" value="0" min="0" max="99">
                </div>
                <div class="colon">:</div>
                <div class="input-wrapper">
                    <label for="inputMinutes">MINUTES</label>
                    <input type="number" id="inputMinutes" value="1" min="0" max="59">
                </div>
                <div class="colon">:</div>
                <div class="input-wrapper">
                    <label for="inputSeconds">SECONDS</label>
                    <input type="number" id="inputSeconds" value="0" min="0" max="59">
                </div>
            </div>

            <!-- Laps (Only Stopwatch) -->
            <div class="laps-container hidden" id="lapsSection"></div>

            <!-- Controls -->
            <div class="controls-wrapper">
                <div class="controls">
                    <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">
                        <svg class="icon" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="icon" id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        <span id="startBtnText">Start</span>
                    </button>

                    <button class="btn btn-reset" id="resetLapBtn" onclick="handleResetLap()">
                        <svg class="icon" id="resetIcon" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        <span id="resetLapText">Reset</span>
                    </button>

                    <button class="btn-icon" id="muteBtn" onclick="toggleMute()" title="Toggle Sound">
                        <svg class="icon" id="soundOnIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg class="icon" id="soundOffIcon" style="display:none;" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>
                </div>

                <div class="hint">
                    <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Press <kbd>Space</kbd> to start / pause
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- DOM Elements ----------
        const timeDisplay    = document.getElementById('timeDisplay');
        const statusText     = document.getElementById('statusText');
        const startBtnText   = document.getElementById('startBtnText');
        const startBtn       = document.getElementById('startBtn');
        const playIcon       = document.getElementById('playIcon');
        const pauseIcon      = document.getElementById('pauseIcon');
        const resetLapText   = document.getElementById('resetLapText');
        const resetIcon      = document.getElementById('resetIcon');
        
        const progressRing   = document.getElementById('progressRing');
        const inputHours     = document.getElementById('inputHours');
        const inputMinutes   = document.getElementById('inputMinutes');
        const inputSeconds   = document.getElementById('inputSeconds');
        
        const muteBtn        = document.getElementById('muteBtn');
        const soundOnIcon    = document.getElementById('soundOnIcon');
        const soundOffIcon   = document.getElementById('soundOffIcon');

        const presetsSection = document.getElementById('presetsSection');
        const inputsSection  = document.getElementById('inputsSection');
        const lapsSection    = document.getElementById('lapsSection');

        const btnModeCountdown = document.getElementById('btnModeCountdown');
        const btnModeStopwatch = document.getElementById('btnModeStopwatch');

        const langBtn        = document.getElementById('langBtn');
        const langLabel      = document.getElementById('langLabel');
        const langDropdown   = document.getElementById('langDropdown');

        // ---------- State ----------
        let currentMode = 'countdown';
        let timerInterval = null;
        let isRunning = false;

        let targetTime = 0;
        let stopwatchStartTime = 0;
        let stopwatchElapsed = 0;

        let totalSeconds = 0;
        let initialTotalSeconds = 0;
        let remainingMs = 0;

        let lapCount = 0;
        let lastLapMs = 0;

        let isMuted = false;
        const circumference = 2 * Math.PI * 130;
        let audioCtx;

        progressRing.style.strokeDasharray = circumference;

        // Icon paths
        const ICON_RESET = '<path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>';
        const ICON_LAP   = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>';

        // ---------- Language Dropdown ----------
        function toggleLangDropdown(e) {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        }

        function changeLang(e, langName) {
            if (e) e.preventDefault();
            langLabel.textContent = langName;
            langDropdown.classList.remove('show');
            
            if (langName === 'हिंदी') document.documentElement.lang = 'hi';
            else if (langName === 'Español') document.documentElement.lang = 'es';
            else if (langName === 'Français') document.documentElement.lang = 'fr';
            else if (langName === 'Deutsch') document.documentElement.lang = 'de';
            else document.documentElement.lang = 'en';
        }

        document.addEventListener('click', (e) => {
            if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
                langDropdown.classList.remove('show');
            }
        });

        // ---------- UI helpers ----------
        function setStartButton(running, label) {
            startBtnText.textContent = label;
            startBtn.classList.toggle('paused', running);
            playIcon.style.display  = running ? 'none' : 'block';
            pauseIcon.style.display = running ? 'block' : 'none';
        }

        function setLapButton(lapMode) {
            resetLapText.textContent = lapMode ? 'Lap' : 'Reset';
            resetIcon.innerHTML = lapMode ? ICON_LAP : ICON_RESET;
        }

        // ---------- Audio ----------
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (isMuted) return;
            try {
                initAudio();
                const beep = (delay) => {
                    const osc  = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    const t0 = audioCtx.currentTime + delay;

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, t0);
                    gain.gain.setValueAtTime(0.1, t0);
                    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 1.5);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(t0);
                    osc.stop(t0 + 1.5);
                };
                beep(0);
                beep(0.3);
            } catch (err) { }
        }

        // ---------- Mode ----------
        function switchMode(mode) {
            if (mode === currentMode) return;

            if (isRunning) {
                if (!confirm('Timer is running. Are you sure you want to switch modes? It will reset the current timer.')) {
                    return;
                }
            }

            currentMode = mode;
            resetTimer();

            if (mode === 'countdown') {
                btnModeCountdown.classList.add('active');
                btnModeStopwatch.classList.remove('active');

                presetsSection.classList.remove('hidden');
                inputsSection.classList.remove('hidden');
                lapsSection.classList.add('hidden');
                muteBtn.style.display = 'flex';

                progressRing.classList.remove('stopwatch-mode');
                startBtn.classList.remove('sw-mode');
            } else {
                btnModeStopwatch.classList.add('active');
                btnModeCountdown.classList.remove('active');

                presetsSection.classList.add('hidden');
                inputsSection.classList.add('hidden');
                lapsSection.classList.remove('hidden');
                muteBtn.style.display = 'none';

                progressRing.classList.add('stopwatch-mode');
                startBtn.classList.add('sw-mode');
            }
        }

        // ---------- Formatting / Display ----------
        function formatStopwatchTime(ms) {
            const totalSecs = Math.floor(ms / 1000);
            const h = Math.floor(totalSecs / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);

            const hStr = h > 0 ? `${String(h).padStart(2, '0')}:` : '';
            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');
            const cStr = String(centiseconds).padStart(2, '0');

            return { main: `${hStr}${mStr}:${sStr}`, ms: `.${cStr}` };
        }

        function updateDisplay() {
            if (currentMode === 'countdown') {
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                timeDisplay.textContent =
                    `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

                if (initialTotalSeconds > 0) {
                    const offset = circumference - (totalSeconds / initialTotalSeconds) * circumference;
                    progressRing.style.strokeDashoffset = offset;
                } else {
                    progressRing.style.strokeDashoffset = circumference;
                }
            } else {
                const timeObj = formatStopwatchTime(stopwatchElapsed);
                timeDisplay.innerHTML = `${timeObj.main}<span class="ms-text">${timeObj.ms}</span>`;

                const currentSecs = (stopwatchElapsed / 1000) % 60;
                const offset = circumference - (currentSecs / 60) * circumference;
                progressRing.style.strokeDashoffset = offset;
            }
        }

        // ---------- Inputs ----------
        function validateInput(input, max) {
            let val = parseInt(input.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            if (val > max) val = max;
            input.value = val;
        }

        [inputHours, inputMinutes, inputSeconds].forEach(input => {
            input.addEventListener('input', () => {
                validateInput(input, input === inputHours ? 99 : 59);
                if (!isRunning && currentMode === 'countdown') updateTimeFromInputs();
            });
        });

        function updateTimeFromInputs() {
            const h = parseInt(inputHours.value, 10) || 0;
            const m = parseInt(inputMinutes.value, 10) || 0;
            const s = parseInt(inputSeconds.value, 10) || 0;

            totalSeconds = (h * 3600) + (m * 60) + s;
            initialTotalSeconds = totalSeconds;
            remainingMs = 0;

            if (!isRunning && currentMode === 'countdown') {
                progressRing.style.stroke = 'var(--green-primary)';
                statusText.textContent = 'READY';
                statusText.style.color = 'var(--text-muted)';
                setStartButton(false, 'Start');
            }

            updateDisplay();
        }

        // ---------- Timer control ----------
        function toggleTimer() {
            if (isRunning) pauseTimer();
            else startTimer();
        }

        function startTimer() {
            initAudio();

            if (currentMode === 'countdown') {
                if (remainingMs <= 0 && totalSeconds <= 0) updateTimeFromInputs();
                const msToRun = remainingMs > 0 ? remainingMs : (totalSeconds * 1000);
                if (msToRun <= 0) return;

                progressRing.style.stroke = 'var(--green-primary)';
                targetTime = Date.now() + msToRun;
                remainingMs = 0;

                inputHours.disabled = true;
                inputMinutes.disabled = true;
                inputSeconds.disabled = true;

                timerInterval = setInterval(() => {
                    const remaining = Math.max(0, targetTime - Date.now());
                    const remainingSecs = Math.ceil(remaining / 1000);

                    if (remainingSecs !== totalSeconds) {
                        totalSeconds = remainingSecs;
                        updateDisplay();
                    }

                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        isRunning = false;
                        remainingMs = 0;
                        totalSeconds = 0;
                        updateDisplay();

                        statusText.textContent = "TIME'S UP!";
                        statusText.style.color = 'var(--danger)';
                        progressRing.style.stroke = 'var(--danger)';
                        setStartButton(false, 'Start');

                        playBeep();

                        inputHours.disabled = false;
                        inputMinutes.disabled = false;
                        inputSeconds.disabled = false;
                    }
                }, 200);
            } else {
                stopwatchStartTime = Date.now() - stopwatchElapsed;
                timerInterval = setInterval(() => {
                    stopwatchElapsed = Date.now() - stopwatchStartTime;
                    updateDisplay();
                }, 31);

                setLapButton(true);
            }

            isRunning = true;
            statusText.textContent = 'RUNNING';
            statusText.style.color = currentMode === 'countdown' ? 'var(--green-primary)' : 'var(--blue-primary)';
            setStartButton(true, 'Pause');
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;

            if (currentMode === 'countdown') {
                remainingMs = Math.max(0, targetTime - Date.now());
                totalSeconds = Math.ceil(remainingMs / 1000);
                updateDisplay();
                inputHours.disabled = false;
                inputMinutes.disabled = false;
                inputSeconds.disabled = false;
            } else {
                stopwatchElapsed = Date.now() - stopwatchStartTime;
                updateDisplay();
                setLapButton(false);
            }

            statusText.textContent = 'PAUSED';
            statusText.style.color = 'var(--text-muted)';
            setStartButton(false, 'Resume');
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            remainingMs = 0;

            if (currentMode === 'countdown') {
                updateTimeFromInputs();
                statusText.textContent = 'READY';
                progressRing.style.stroke = 'var(--green-primary)';
                inputHours.disabled = false;
                inputMinutes.disabled = false;
                inputSeconds.disabled = false;
            } else {
                stopwatchElapsed = 0;
                stopwatchStartTime = 0;
                lapCount = 0;
                lastLapMs = 0;
                lapsSection.innerHTML = '';
                updateDisplay();
                statusText.textContent = 'READY';
                progressRing.style.stroke = 'var(--blue-primary)';
            }

            statusText.style.color = 'var(--text-muted)';
            setStartButton(false, 'Start');
            setLapButton(false);
        }

        // ---------- Reset / Lap ----------
        function handleResetLap() {
            if (currentMode === 'countdown') {
                resetTimer();
            } else {
                if (isRunning) recordLap();
                else resetTimer();
            }
        }

        function recordLap() {
            lapCount++;
            const currentTotalMs = Date.now() - stopwatchStartTime;
            const lapTime = currentTotalMs - lastLapMs;
            lastLapMs = currentTotalMs;

            const lapObj = formatStopwatchTime(lapTime);
            const lapDiv = document.createElement('div');
            lapDiv.className = 'lap-item';
            lapDiv.innerHTML = `
                <span>Lap ${lapCount}</span>
                <span>+${lapObj.main}${lapObj.ms}</span>
            `;
            lapsSection.prepend(lapDiv);
        }

        // ---------- Presets ----------
        function setPreset(minutes) {
            if (isRunning) {
                if (!confirm('Timer is running. Reset and apply this preset?')) return;
            }
            resetTimer();
            inputHours.value = Math.floor(minutes / 60);
            inputMinutes.value = minutes % 60;
            inputSeconds.value = 0;
            updateTimeFromInputs();
        }

        // ---------- Mute ----------
        function toggleMute() {
            isMuted = !isMuted;
            if (isMuted) {
                muteBtn.classList.add('muted');
                soundOnIcon.style.display = 'none';
                soundOffIcon.style.display = 'block';
            } else {
                muteBtn.classList.remove('muted');
                soundOnIcon.style.display = 'block';
                soundOffIcon.style.display = 'none';
            }
        }

        // ---------- Keyboard ----------
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const el = e.target;
            if (el.closest('button, a, input, textarea, select, [contenteditable="true"]')) return;

            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault();
                toggleTimer();
            }
        });

        // ---------- Init ----------
        switchMode('countdown');
    </script>
</body>
</html>
