<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Clock Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --green-primary: #4caf50;
            --green-hover: #43a047;
            --gray-light: #f3f4f6;
            --gray-hover: #e5e7eb;
            --border-color: #e5e7eb;
            --danger: #ef4444;
            --blue-primary: #3b82f6;
            --dropdown-bg: #ffffff;
            --shadow-color: rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--card-bg);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            padding: 2vh 4vw; 
        }

        .top-section {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            flex-shrink: 0; 
        }

        .header {
            text-align: left;
            max-width: 850px;
        }

        .header h1 {
            font-size: clamp(28px, 4.5vh, 42px);
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 0.5vh;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: clamp(15px, 2.2vh, 18px);
            color: var(--text-muted);
            line-height: 1.4;
        }

        .mode-switch {
            display: flex;
            background-color: var(--gray-light);
            border-radius: 30px;
            padding: 4px;
        }

        .mode-btn {
            padding: 8px 24px;
            border-radius: 25px;
            border: none;
            background: transparent;
            font-size: clamp(14px, 1.9vh, 17px);
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            flex-grow: 1; 
            flex-shrink: 1; 
            gap: 2vh; 
        }

        .presets {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(8px, 1.2vw, 15px);
            width: 100%;
        }

        .preset-btn {
            background-color: var(--gray-light);
            color: var(--text-muted);
            border: none;
            padding: 0.6vh 1.4vw;
            border-radius: 20px;
            font-size: clamp(13px, 1.8vh, 16px);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background-color: var(--gray-hover);
            color: var(--text-main);
        }

        .timer-display {
            position: relative;
            width: clamp(200px, 32vh, 320px); 
            height: clamp(200px, 32vh, 320px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 1vh 0;
        }

        .ring-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .ring-bg {
            fill: none;
            stroke: var(--gray-light);
            stroke-width: 12;
        }

        .ring-progress {
            fill: none;
            stroke: var(--green-primary);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 817;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.1s linear, stroke 0.3s;
        }

        .ring-progress.stopwatch-mode {
            stroke: var(--blue-primary);
        }

        .time-text {
            font-size: clamp(2.5rem, 6.5vh, 4rem); 
            font-weight: 900;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            z-index: 10;
            line-height: 1;
            margin-bottom: 0.5vh;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .time-text.ms-text {
            font-size: clamp(1.3rem, 3vh, 2rem);
            color: var(--text-muted);
            margin-left: 2px;
        }

        .status-text {
            font-size: clamp(12px, 1.6vh, 15px);
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 2px;
            z-index: 10;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: clamp(12px, 2vw, 25px);
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-wrapper label {
            font-size: clamp(11px, 1.5vh, 14px);
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 0.8vh;
        }

        .input-wrapper input {
            width: clamp(70px, 9vw, 100px);
            height: clamp(50px, 7.5vh, 70px);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: clamp(1.4rem, 3.5vh, 2rem);
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
            outline: none;
            background-color: var(--card-bg);
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--green-primary);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.15);
        }

        .input-wrapper input:disabled {
            background-color: var(--gray-light);
            color: var(--text-muted);
            cursor: not-allowed;
            border-color: var(--border-color);
        }

        .input-wrapper input::-webkit-outer-spin-button,
        .input-wrapper input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .colon {
            font-size: clamp(1.4rem, 3.5vh, 2rem);
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1.8vh;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        .laps-container {
            width: 100%;
            max-width: 320px;
            height: clamp(80px, 15vh, 150px);
            overflow-y: auto;
            border-radius: 12px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--gray-light);
            font-size: clamp(13px, 1.8vh, 16px);
            font-weight: 500;
            color: var(--text-main);
        }

        .lap-item span:first-child {
            color: var(--text-muted);
        }

        .laps-container::-webkit-scrollbar { width: 6px; }
        .laps-container::-webkit-scrollbar-thumb { background-color: var(--gray-hover); border-radius: 10px; }

        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8vh;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 1.8vw, 20px);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: clamp(10px, 1.8vh, 16px) clamp(22px, 3vw, 38px);
            border-radius: 30px;
            font-size: clamp(15px, 2.2vh, 18px);
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-start {
            background-color: var(--green-primary);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .btn-start:hover {
            background-color: var(--green-hover);
            transform: translateY(-2px);
        }

        .btn-start.paused {
            background-color: #ff9800;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }

        .btn-start.sw-mode {
            background-color: var(--blue-primary);
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .btn-start.sw-mode:hover {
            background-color: #2563eb;
        }

        .btn-reset {
            background-color: var(--gray-light);
            color: var(--text-main);
        }

        .btn-reset:hover {
            background-color: var(--gray-hover);
            transform: translateY(-2px);
        }

        .btn-icon {
            width: clamp(44px, 6.5vh, 56px);
            height: clamp(44px, 6.5vh, 56px);
            border-radius: 50%;
            background-color: var(--gray-light);
            color: var(--text-muted);
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-icon:hover {
            background-color: var(--gray-hover);
            color: var(--text-main);
        }

        .btn-icon.muted {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .hint {
            font-size: clamp(13px, 1.7vh, 15px);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .hint kbd {
            background-color: var(--gray-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-family: inherit;
            font-size: clamp(11px, 1.5vh, 13px);
            font-weight: 600;
            color: var(--text-main);
        }

        /* UPDATED FOOTER STYLES */
        .footer {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px; 
            font-size: clamp(14px, 1.9vh, 17px);
            color: var(--text-muted);
            flex-shrink: 0; 
            padding-top: 1.5vh;
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 600;
        }

        .footer a:hover {
            color: var(--green-primary);
            text-decoration: underline;
        }

        /* Language Controls */
        .footer-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 20px;
        }

        .lang-dropdown {
            position: relative;
        }

        .lang-btn {
            background-color: var(--gray-light);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background-color: var(--gray-hover);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            bottom: 100%; /* Pops up above */
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--dropdown-bg);
            min-width: 140px;
            box-shadow: 0 4px 15px var(--shadow-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            z-index: 100;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 10px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.9em;
            transition: background-color 0.2s;
        }

        .dropdown-content a:hover {
            background-color: var(--gray-light);
            color: var(--green-primary);
        }

        .dropdown-content.show {
            display: block;
        }

        svg.icon { width: clamp(18px, 2.4vh, 22px); height: clamp(18px, 2.4vh, 22px); fill: currentColor; }
        svg.hint-icon { width: clamp(14px, 2vh, 18px); height: clamp(14px, 2vh, 18px); }
        svg.ui-icon { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header & Mode Toggle -->
        <div class="top-section">
            <div class="header">
                <h1>Countdown Clock Timer</h1>
                <p>Set any duration and count down with a visual ring. Perfect for cooking, study sprints, meetings, and workouts.</p>
            </div>
            <div class="mode-switch">
                <button class="mode-btn active" id="btnModeCountdown" onclick="switchMode('countdown')">Countdown</button>
                <button class="mode-btn" id="btnModeStopwatch" onclick="switchMode('stopwatch')">Stopwatch</button>
            </div>
        </div>

        <!-- Main Center Area -->
        <div class="main-content">
            
            <div class="presets" id="presetsSection">
                <button class="preset-btn" onclick="setPreset(1)">1 min</button>
                <button class="preset-btn" onclick="setPreset(5)">5 min</button>
                <button class="preset-btn" onclick="setPreset(10)">10 min</button>
                <button class="preset-btn" onclick="setPreset(15)">15 min</button>
                <button class="preset-btn" onclick="setPreset(25)">25 min</button>
                <button class="preset-btn" onclick="setPreset(30)">30 min</button>
                <button class="preset-btn" onclick="setPreset(45)">45 min</button>
                <button class="preset-btn" onclick="setPreset(60)">1 hr</button>
            </div>

            <div class="timer-display">
                <svg class="ring-svg" viewBox="0 0 280 280">
                    <circle class="ring-bg" cx="140" cy="140" r="130"></circle>
                    <circle class="ring-progress" id="progressRing" cx="140" cy="140" r="130"></circle>
                </svg>
                <div class="time-text" id="timeDisplay">00:00:00</div>
                <div class="status-text" id="statusText">READY</div>
            </div>

            <div class="input-group" id="inputsSection">
                <div class="input-wrapper">
                    <label>HOURS</label>
                    <input type="number" id="inputHours" value="0" min="0" max="99">
                </div>
                <div class="colon">:</div>
                <div class="input-wrapper">
                    <label>MINUTES</label>
                    <input type="number" id="inputMinutes" value="1" min="0" max="59">
                </div>
                <div class="colon">:</div>
                <div class="input-wrapper">
                    <label>SECONDS</label>
                    <input type="number" id="inputSeconds" value="0" min="0" max="59">
                </div>
            </div>

            <div class="laps-container hidden" id="lapsSection"></div>

            <div class="controls-wrapper">
                <div class="controls">
                    <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">
                        <svg class="icon" id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg class="icon" id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        <span id="startBtnText">Start</span>
                    </button>
                    
                    <button class="btn btn-reset" id="resetLapBtn" onclick="handleResetLap()">
                        <svg class="icon" id="resetIcon" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        <span id="resetLapText">Reset</span>
                    </button>
                    
                    <button class="btn-icon" id="muteBtn" onclick="toggleMute()" title="Toggle Sound">
                        <svg class="icon" id="soundOnIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg class="icon" id="soundOffIcon" style="display:none;" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>
                </div>

                <div class="hint">
                    <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Press <kbd>Space</kbd> to start / pause
                </div>
            </div>
        </div>

        <!-- Updated Footer -->
        <div class="footer">
            <a href="https://yourwebsite.com/about" target="_blank">About</a>
            <a href="https://yourwebsite.com/privacy" target="_blank">Privacy</a>
            
            <div class="footer-controls">
                <!-- Language Dropdown -->
                <div class="lang-dropdown">
                    <button class="lang-btn" id="langBtn" onclick="toggleLangDropdown(event)">
                        <svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        EN
                    </button>
                    <div class="dropdown-content" id="langDropdown">
                        <a href="#" onclick="changeLang('English')">English</a>
                        <a href="#" onclick="changeLang('Español')">Español</a>
                        <a href="#" onclick="changeLang('Français')">Français</a>
                        <a href="#" onclick="changeLang('Deutsch')">Deutsch</a>
                        <a href="#" onclick="changeLang('हिंदी')">हिंदी</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const timeDisplay = document.getElementById('timeDisplay');
        const statusText = document.getElementById('statusText');
        const startBtnText = document.getElementById('startBtnText');
        const startBtn = document.getElementById('startBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const resetLapText = document.getElementById('resetLapText');
        const resetIcon = document.getElementById('resetIcon');
        
        const progressRing = document.getElementById('progressRing');
        const inputHours = document.getElementById('inputHours');
        const inputMinutes = document.getElementById('inputMinutes');
        const inputSeconds = document.getElementById('inputSeconds');
        
        const muteBtn = document.getElementById('muteBtn');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');

        const presetsSection = document.getElementById('presetsSection');
        const inputsSection = document.getElementById('inputsSection');
        const lapsSection = document.getElementById('lapsSection');
        
        const btnModeCountdown = document.getElementById('btnModeCountdown');
        const btnModeStopwatch = document.getElementById('btnModeStopwatch');
        
        // Language Elements
        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');

        // State Variables
        let currentMode = 'countdown'; 
        let timerInterval = null;
        let isRunning = false;
        
        let targetTime = 0;         
        let stopwatchStartTime = 0; 
        let stopwatchElapsed = 0;   
        
        let totalSeconds = 0;
        let initialTotalSeconds = 0;
        
        let lapCount = 0;
        let lastLapMs = 0;

        let isMuted = false;
        const circumference = 2 * Math.PI * 130;
        let audioCtx;

        // --- LANGUAGE LOGIC ---
        function toggleLangDropdown(e) {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        }

        function changeLang(lang) {
            langBtn.innerHTML = `<svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg> ${lang.substring(0,2).toUpperCase()}`;
            langDropdown.classList.remove('show');
            // Translation logic yahan add kar sakte hain
            console.log("Language changed to: " + lang);
        }

        document.addEventListener('click', (e) => {
            if (!langBtn.contains(e.target) && !langDropdown.contains(e.target)) {
                langDropdown.classList.remove('show');
            }
        });

        // --- AUDIO & TIMER LOGIC ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (isMuted) return;
            try {
                initAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1.5);
                
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain2.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start();
                    osc2.stop(audioCtx.currentTime + 1.5);
                }, 300);
            } catch (e) {}
        }

        function switchMode(mode) {
            if (isRunning) {
                if(!confirm("Timer is running. Are you sure you want to switch modes? It will reset the current timer.")) return;
            }
            
            currentMode = mode;
            resetTimer();

            if (mode === 'countdown') {
                btnModeCountdown.classList.add('active');
                btnModeStopwatch.classList.remove('active');
                
                presetsSection.classList.remove('hidden');
                inputsSection.classList.remove('hidden');
                lapsSection.classList.add('hidden');
                muteBtn.style.display = 'flex';
                
                progressRing.classList.remove('stopwatch-mode');
                startBtn.classList.remove('sw-mode');
                timeDisplay.classList.remove('ms-text');
            } else {
                btnModeStopwatch.classList.add('active');
                btnModeCountdown.classList.remove('active');
                
                presetsSection.classList.add('hidden');
                inputsSection.classList.add('hidden');
                lapsSection.classList.remove('hidden');
                muteBtn.style.display = 'none';
                
                progressRing.classList.add('stopwatch-mode');
                startBtn.classList.add('sw-mode');
                timeDisplay.classList.add('ms-text');
            }
        }

        function formatStopwatchTime(ms) {
            const totalSecs = Math.floor(ms / 1000);
            const h = Math.floor(totalSecs / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            const s = totalSecs % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);

            const hStr = h > 0 ? `${String(h).padStart(2, '0')}:` : '';
            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');
            const cStr = String(centiseconds).padStart(2, '0');

            return { 
                main: `${hStr}${mStr}:${sStr}`, 
                ms: `.${cStr}` 
            };
        }

        function updateDisplay() {
            if (currentMode === 'countdown') {
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;
                timeDisplay.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                
                if (initialTotalSeconds > 0) {
                    const offset = circumference - (totalSeconds / initialTotalSeconds) * circumference;
                    progressRing.style.strokeDashoffset = offset;
                } else {
                    progressRing.style.strokeDashoffset = 0;
                }
            } else {
                const timeObj = formatStopwatchTime(stopwatchElapsed);
                timeDisplay.innerHTML = `${timeObj.main}<span class="ms-text">${timeObj.ms}</span>`;
                
                const currentSecs = (stopwatchElapsed / 1000) % 60;
                const offset = circumference - (currentSecs / 60) * circumference;
                progressRing.style.strokeDashoffset = offset;
            }
        }

        function validateInput(input, max) {
            let val = parseInt(input.value);
            if (isNaN(val) || val < 0) val = 0;
            if (val > max) val = max;
            input.value = val;
        }

        [inputHours, inputMinutes, inputSeconds].forEach(input => {
            input.addEventListener('input', () => {
                if(input === inputHours) validateInput(input, 99);
                else validateInput(input, 59);
                
                if (!isRunning && currentMode === 'countdown') updateTimeFromInputs();
            });
        });

        function updateTimeFromInputs() {
            const h = parseInt(inputHours.value) || 0;
            const m = parseInt(inputMinutes.value) || 0;
            const s = parseInt(inputSeconds.value) || 0;
            totalSeconds = (h * 3600) + (m * 60) + s;
            initialTotalSeconds = totalSeconds;
            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            initAudio();

            if (currentMode === 'countdown') {
                if (totalSeconds === 0) updateTimeFromInputs();
                if (totalSeconds <= 0) return;
                
                targetTime = Date.now() + (totalSeconds * 1000);
                
                inputHours.disabled = true; inputMinutes.disabled = true; inputSeconds.disabled = true;
                
                timerInterval = setInterval(() => {
                    const remaining = Math.max(0, Math.round((targetTime - Date.now()) / 1000));
                    
                    if (remaining !== totalSeconds) {
                        totalSeconds = remaining;
                        updateDisplay();
                    }
                    
                    if (totalSeconds === 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        statusText.textContent = 'TIME\'S UP!';
                        statusText.style.color = 'var(--danger)';
                        progressRing.style.stroke = 'var(--danger)';
                        resetBtnText();
                        playBeep();
                        inputHours.disabled = false; inputMinutes.disabled = false; inputSeconds.disabled = false;
                        return;
                    }
                }, 200);

            } else {
                stopwatchStartTime = Date.now() - stopwatchElapsed;
                
                timerInterval = setInterval(() => {
                    stopwatchElapsed = Date.now() - stopwatchStartTime;
                    updateDisplay();
                }, 31); 
            }

            isRunning = true;
            statusText.textContent = 'RUNNING';
            statusText.style.color = currentMode === 'countdown' ? 'var(--green-primary)' : 'var(--blue-primary)';
            startBtnText.textContent = 'Pause';
            startBtn.classList.add('paused');
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            
            if (currentMode === 'stopwatch') {
                resetLapText.textContent = 'Lap';
                resetIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>';
            }
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            
            if (currentMode === 'stopwatch') {
                stopwatchElapsed = Date.now() - stopwatchStartTime;
            }
            
            statusText.textContent = 'PAUSED';
            statusText.style.color = 'var(--text-muted)';
            startBtnText.textContent = 'Resume';
            startBtn.classList.remove('paused');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            
            if (currentMode === 'stopwatch') {
                resetBtnText();
            }
        }

        function resetBtnText() {
            startBtnText.textContent = 'Start';
            startBtn.classList.remove('paused');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            
            if (currentMode === 'stopwatch') {
                resetLapText.textContent = 'Reset';
                resetIcon.innerHTML = '<path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>';
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            
            if (currentMode === 'countdown') {
                inputHours.value = 0; inputMinutes.value = 1; inputSeconds.value = 0;
                updateTimeFromInputs();
                statusText.textContent = 'READY';
                progressRing.style.stroke = 'var(--green-primary)';
                inputHours.disabled = false; inputMinutes.disabled = false; inputSeconds.disabled = false;
            } else {
                stopwatchElapsed = 0;
                stopwatchStartTime = 0;
                lapCount = 0;
                lastLapMs = 0;
                lapsSection.innerHTML = '';
                updateDisplay();
                statusText.textContent = 'READY';
                progressRing.style.stroke = 'var(--blue-primary)';
            }
            
            statusText.style.color = 'var(--text-muted)';
            resetBtnText();
        }

        function handleResetLap() {
            if (currentMode === 'countdown') {
                resetTimer();
            } else {
                if (isRunning) {
                    recordLap();
                } else {
                    resetTimer();
                }
            }
        }

        function recordLap() {
            lapCount++;
            const currentTotalMs = Date.now() - stopwatchStartTime;
            const lapTime = currentTotalMs - lastLapMs;
            lastLapMs = currentTotalMs;

            const lapObj = formatStopwatchTime(lapTime);

            const lapDiv = document.createElement('div');
            lapDiv.className = 'lap-item';
            lapDiv.innerHTML = `
                <span>Lap ${lapCount}</span>
                <span>+${lapObj.main}${lapObj.ms}</span>
            `;
            
            lapsSection.prepend(lapDiv);
        }

        function setPreset(minutes) {
            resetTimer();
            inputHours.value = Math.floor(minutes / 60);
            inputMinutes.value = minutes % 60;
            inputSeconds.value = 0;
            updateTimeFromInputs();
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (isMuted) {
                muteBtn.classList.add('muted');
                soundOnIcon.style.display = 'none';
                soundOffIcon.style.display = 'block';
            } else {
                muteBtn.classList.remove('muted');
                soundOnIcon.style.display = 'block';
                soundOffIcon.style.display = 'none';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return; 
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            }
        });

        window.onload = () => {
            switchMode('countdown');
        };
    </script>
</body>
</html>
